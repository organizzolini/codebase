# Values for the caelundas-api Deployment. Layer after base.yaml:
#   --values values/base.yaml --values values/caelundas-api.yaml
image:
  repository: ghcr.io/organizzolini/caelundas-api

# The API's development port, from caelundas-api's configuration/.env.default, which the image listens on
containerPort: 6173

service:
  port: 6173

# Lightship serves probes on 9000, separate from the application port
probes:
  liveness:
    path: /live
    port: 9000
  readiness:
    path: /ready
    port: 9000

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

env:
  - name: CAELUNDAS_POSTGRES_HOST
    value: postgres-pooler-rw.organizzolini.svc.cluster.local
  - name: CAELUNDAS_POSTGRES_DATABASE
    value: caelundas_production
  - name: CAELUNDAS_POSTGRES_SCHEMA
    value: caelundas
  - name: CAELUNDAS_POSTGRES_USERNAME
    value: caelundas_username
  - name: CAELUNDAS_POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: caelundas-postgres
        key: password
