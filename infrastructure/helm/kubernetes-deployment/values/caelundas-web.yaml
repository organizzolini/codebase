# Values for the caelundas-web Deployment. Layer after base.yaml:
#   --values values/base.yaml --values values/caelundas-web.yaml
image:
  repository: ghcr.io/organizzolini/caelundas-web

# Unprivileged nginx listens on the web app's development port, from caelundas-web's vite.config.mts; the Service exposes it on 80
containerPort: 8967

service:
  port: 80

probes:
  liveness:
    path: /
    port: 8967
  readiness:
    path: /
    port: 8967

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Unprivileged nginx writes its pid file to the temporary directory and its request buffers to /var/cache/nginx
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache/nginx
