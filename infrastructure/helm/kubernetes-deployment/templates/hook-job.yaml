{{- /* PreSync Job that runs before each rollout. Renders only with the app image, so it never runs ahead of a release. */ -}}
{{- if and .Values.hook.enabled .Values.image.tag }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-hook
  labels:
    {{- include "kubernetes-deployment.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "kubernetes-deployment.selectorLabels" . | nindent 8 }}
        {{- /* Keeps migration pods out of the Service selector */}}
        app.kubernetes.io/component: hook
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hook
          image: "{{ .Values.hook.image.repository }}:{{ .Values.hook.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.hook.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hook.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
