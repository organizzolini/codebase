suite: kubernetes-deployment
templates:
  - templates/deployment.yaml
  - templates/service.yaml
values:
  - ../values/base.yaml
tests:
  - it: renders nothing while image.tag is empty
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    asserts:
      - template: templates/deployment.yaml
        hasDocuments:
          count: 0
      - template: templates/service.yaml
        hasDocuments:
          count: 0

  - it: renders a Deployment and Service once tagged
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/organizzolini/caelundas-api:1.0.0
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].targetPort
          value: 6173

  - it: runs the pod as non-root
    set:
      image.tag: 1.0.0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: labels the Service selector and the Deployment pods by component
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
    asserts:
      - template: templates/service.yaml
        equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: server
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - template: templates/deployment.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: server

  - it: api values reach production through the pooler
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_HOST
            value: postgres-pooler-rw.organizzolini.svc.cluster.local
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_DATABASE
            value: caelundas_production
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9000
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9000
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: probes
            containerPort: 9000

  - it: web values expose port 80 to the development port 8967
    values:
      - ../values/base.yaml
      - ../values/caelundas-web.yaml
    set:
      image.tag: 1.0.0
    asserts:
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].port
          value: 80
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].targetPort
          value: 8967
