suite: kubernetes-deployment
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/hook-job.yaml
values:
  - ../values/base.yaml
tests:
  - it: renders nothing while image.tag is empty
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    asserts:
      - template: templates/deployment.yaml
        hasDocuments:
          count: 0
      - template: templates/service.yaml
        hasDocuments:
          count: 0
      - template: templates/hook-job.yaml
        hasDocuments:
          count: 0

  - it: renders a Deployment and Service once tagged
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
      hook.image.tag: 1.0.0
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/organizzolini/caelundas-api:1.0.0
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].targetPort
          value: 3000

  - it: runs the pod as non-root
    set:
      image.tag: 1.0.0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: hook job is a PreSync hook using the hook image
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
      hook.image.tag: 1.0.1
    template: templates/hook-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/organizzolini/caelundas-cli:1.0.1
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: hook

  - it: fails when the hook is enabled without a hook image tag
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
      hook.image.tag: ""
    template: templates/hook-job.yaml
    asserts:
      - failedTemplate:
          errorMessage: hook.image.tag must be set when the hook is enabled

  - it: separates the Service and Deployment from hook pods by component
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
      hook.image.tag: 1.0.0
    asserts:
      - template: templates/service.yaml
        equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: server
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - template: templates/deployment.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: server

  - it: api values reach production through the pooler and migrate directly
    values:
      - ../values/base.yaml
      - ../values/caelundas-api.yaml
    set:
      image.tag: 1.0.0
      hook.image.tag: 1.0.0
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_HOST
            value: postgres-pooler-rw.codebase.svc.cluster.local
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_DATABASE
            value: caelundas_production
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9000
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9000
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: probes
            containerPort: 9000
      - template: templates/hook-job.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_HOST
            value: postgres-rw.codebase.svc.cluster.local

  - it: web values expose port 80 to 8080 and run no hook
    values:
      - ../values/base.yaml
      - ../values/caelundas-web.yaml
    set:
      image.tag: 1.0.0
    asserts:
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].port
          value: 80
      - template: templates/service.yaml
        equal:
          path: spec.ports[0].targetPort
          value: 8080
      - template: templates/hook-job.yaml
        hasDocuments:
          count: 0
