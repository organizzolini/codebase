# Default values for cloudflared.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # Exact release, never latest
  tag: 2026.10.7

# Secret holding the tunnel token, created by the bootstrap root
tokenSecret:
  name: cloudflared-token
  key: token

# Metrics and probe port; the connector dials out, so no Service is needed
metricsPort: 2000

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
