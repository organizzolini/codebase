suite: kubernetes-job
templates:
  - templates/job.yaml
  - templates/pvc.yaml
  - templates/NOTES.txt
values:
  - ../values/base.yaml
tests:
  - it: omits completionMode by default
    asserts:
      - template: templates/job.yaml
        notExists:
          path: spec.completionMode
      - template: templates/job.yaml
        exists:
          path: spec.backoffLimit
      - template: templates/pvc.yaml
        hasDocuments:
          count: 1

  - it: renders Indexed completion with per-index backoff
    set:
      job.completionMode: Indexed
      job.backoffLimitPerIndex: 2
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.completionMode
          value: Indexed
      - equal:
          path: spec.backoffLimitPerIndex
          value: 2
      - notExists:
          path: spec.backoffLimit

  - it: mounts an emptyDir when persistence.type is emptyDir
    set:
      persistence.type: emptyDir
    asserts:
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
      - template: templates/pvc.yaml
        hasDocuments:
          count: 0

  - it: sets priorityClassName when given
    set:
      priorityClassName: batch-low
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: batch-low

  - it: appends extraEnv after env
    set:
      env:
        - name: FIRST
          value: "1"
      extraEnv:
        - name: SECOND
          value: "2"
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FIRST
              value: "1"
            - name: SECOND
              value: "2"

  - it: renders an empty tag as `repository:` rather than the chart appVersion
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/organizzolini/caelundas-cli:"

  - it: caelundas-cli values render an Indexed staging job
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    set:
      image.tag: 1.0.0
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/organizzolini/caelundas-cli:1.0.0
      - equal:
          path: spec.completionMode
          value: Indexed
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_DATABASE
            value: caelundas_staging
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: caelundas-postgres
                key: password

  - it: caelundas-cli mounts only scratch space and creates no PVC
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    asserts:
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.volumes
          value:
            - name: tmp
              emptyDir: {}
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp
              mountPath: /tmp
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - template: templates/pvc.yaml
        hasDocuments:
          count: 0

  - it: caelundas-cli derives the year's dates from START_YEAR and the completion index
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: tini
      - matchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: year=\$\(\(\$\{START_YEAR:\?START_YEAR is required\} \+ \$\{JOB_COMPLETION_INDEX:\?JOB_COMPLETION_INDEX is required\}\)\);\s+export START_DATE=.\$year-01-01. END_DATE=.\$year-12-31.;\s+exec node caelundas-cli\.main\.js caelundas

  - it: caelundas-cli stops before running when START_YEAR or the completion index is unset
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: ^set -eu;
      - matchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: \$\{START_YEAR:\?START_YEAR is required\}

  - it: caelundas-cli requests 1Gi against a 1536Mi limit
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1536Mi

  - it: prints the follow and cleanup commands for the release
    release:
      name: ingest-1900-1902
      namespace: organizzolini
    template: templates/NOTES.txt
    asserts:
      - matchRegex:
          path: raw
          pattern: kubectl get jobs -n organizzolini
      - matchRegex:
          path: raw
          pattern: kubectl logs -n organizzolini -l job-name=ingest-1900-1902-kubernetes-job --prefix --tail=50
      - matchRegex:
          path: raw
          pattern: helm uninstall ingest-1900-1902 -n organizzolini
