suite: kubernetes-job
templates:
  - templates/configmap.yaml
  - templates/job.yaml
  - templates/pvc.yaml
  - templates/NOTES.txt
values:
  - ../values/base.yaml
tests:
  - it: renders a plain Job with a backoff limit by default
    asserts:
      - template: templates/job.yaml
        exists:
          path: spec.backoffLimit
      - template: templates/pvc.yaml
        hasDocuments:
          count: 1

  - it: mounts an emptyDir when persistence.type is emptyDir
    set:
      persistence.type: emptyDir
    asserts:
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
      - template: templates/pvc.yaml
        hasDocuments:
          count: 0

  - it: sets priorityClassName when given
    set:
      priorityClassName: batch-low
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: batch-low

  - it: renders an empty tag as `repository:` rather than the chart appVersion
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/organizzolini/caelundas-cli:"

  - it: caelundas-cli values render a staging job
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    set:
      image.tag: 1.0.0
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/organizzolini/caelundas-cli:1.0.0
      - notExists:
          path: spec.completionMode
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_DATABASE
            value: caelundas_staging
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAELUNDAS_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: caelundas-postgres
                key: password

  - it: caelundas-cli mounts only scratch space and creates no PVC
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    asserts:
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.volumes
          value:
            - name: tmp
              emptyDir: {}
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp
              mountPath: /tmp
      - template: templates/job.yaml
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - template: templates/pvc.yaml
        hasDocuments:
          count: 0

  - it: caelundas-cli runs the image's own start command, which names the caelundas subcommand
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: renders no ConfigMap, volume or mount without envFile
    asserts:
      - template: templates/configmap.yaml
        hasDocuments:
          count: 0
      - template: templates/job.yaml
        notContains:
          path: spec.template.spec.volumes
          content:
            name: env-file

  - it: renders a ConfigMap, volume and read-only file mount when envFile is set
    release:
      name: ingest
    set:
      envFile: "START_DATE=\"2026-07-01\"\nEND_DATE=\"2026-07-31\"\n"
      envFileMountPath: /app/configuration/.env
    asserts:
      - template: templates/configmap.yaml
        equal:
          path: metadata.name
          value: ingest-kubernetes-job-env
      - template: templates/configmap.yaml
        equal:
          path: data[".env"]
          value: "START_DATE=\"2026-07-01\"\nEND_DATE=\"2026-07-31\"\n"
      - template: templates/job.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: env-file
            configMap:
              name: ingest-kubernetes-job-env
      - template: templates/job.yaml
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: env-file
            mountPath: /app/configuration/.env
            subPath: .env
            readOnly: true

  - it: requires envFileMountPath when envFile is set
    set:
      envFile: A=1
    template: templates/job.yaml
    asserts:
      - failedTemplate:
          errorMessage: envFileMountPath is required with envFile

  - it: caelundas-cli requests 1Gi against a 1536Mi limit
    values:
      - ../values/base.yaml
      - ../values/caelundas-cli.yaml
    template: templates/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1536Mi

  - it: prints the follow and cleanup commands for the release
    release:
      name: ingest-1900-1902
      namespace: organizzolini
    template: templates/NOTES.txt
    asserts:
      - matchRegex:
          path: raw
          pattern: kubectl get jobs -n organizzolini
      - matchRegex:
          path: raw
          pattern: kubectl logs -n organizzolini -l job-name=ingest-1900-1902-kubernetes-job --prefix --tail=50
      - matchRegex:
          path: raw
          pattern: helm uninstall ingest-1900-1902 -n organizzolini
