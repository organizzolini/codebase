apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubernetes-job.fullname" . }}
  labels:
    {{- include "kubernetes-job.labels" . | nindent 4 }}
    {{- if .Values.metadata.gitCommit }}
    caelundas.job/git-commit: {{ .Values.metadata.gitCommit | quote }}
    {{- end }}
    {{- if .Values.metadata.timestamp }}
    caelundas.job/timestamp: {{ .Values.metadata.timestamp | quote }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  completions: {{ .Values.job.completions }}
  {{- if gt (int .Values.job.parallelism) 1 }}
  parallelism: {{ .Values.job.parallelism }}
  {{- end }}
  {{- if .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kubernetes-job.selectorLabels" . | nindent 8 }}
        {{- if .Values.metadata.gitCommit }}
        caelundas.job/git-commit: {{ .Values.metadata.gitCommit | quote }}
        {{- end }}
        {{- if .Values.metadata.timestamp }}
        caelundas.job/timestamp: {{ .Values.metadata.timestamp | quote }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: default
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.envFile }}
            - name: env-file
              mountPath: {{ required "envFileMountPath is required with envFile" .Values.envFileMountPath }}
              subPath: .env
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.envFile }}
        - name: env-file
          configMap:
            name: {{ include "kubernetes-job.fullname" . }}-env
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if eq .Values.persistence.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "kubernetes-job.fullname" . }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
