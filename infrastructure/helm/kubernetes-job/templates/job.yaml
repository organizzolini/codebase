apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubernetes-job.fullname" . }}
  labels:
    {{- include "kubernetes-job.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "kubernetes-job.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required (printf "image.tag is required (no release of %s yet)" .Values.image.repository) .Values.image.tag }}"
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.envFile }}
            - name: env-file
              mountPath: {{ required "envFileMountPath is required with envFile" .Values.envFileMountPath }}
              subPath: .env
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.envFile }}
        - name: env-file
          configMap:
            name: {{ include "kubernetes-job.fullname" . }}-env
        {{- end }}
