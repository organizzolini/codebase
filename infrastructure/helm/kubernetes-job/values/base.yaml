# Default values for kubernetes-job.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: my-application
  pullPolicy: IfNotPresent
  # The image tag. Empty renders `repository:`, which no cluster can pull, so a
  # caller checks for it before installing.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only; the Job mounts an emptyDir at the temporary directory for scratch space
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Labels the templates stamp on the Job and PVC when set. Declared here so the
# templates can read them when a deploy passes neither.
metadata:
  gitCommit: ""
  timestamp: ""

# Job-specific configuration
job:
  # Number of retries before considering a Job as failed
  backoffLimit: 3
  # NonIndexed runs completions interchangeably; Indexed gives each pod its own index
  completionMode: NonIndexed
  # Number of successful completions required
  completions: 1
  # Number of pods running in parallel
  parallelism: 1
  # Retries per index, rendered only with Indexed completion and replaces backoffLimit
  # backoffLimitPerIndex: 2
  # Time in seconds after which a finished job is automatically deleted
  ttlSecondsAfterFinished: 86400

# Name of an existing PriorityClass for the pod; empty omits the field
priorityClassName: ""

# Environment variables
env: []
# - name: MY_ENV_VAR
#   value: "my-value"
# - name: SECRET_ENV_VAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: secret-key

# Environment variables appended after env, for per-run values passed with --set-json
extraEnv: []

# Command and arguments override
command: []
# - "/bin/sh"
args: []
# - "-c"
# - "echo hello"

persistence:
  enabled: true
  # persistentVolumeClaim binds a PVC; emptyDir mounts scratch space and creates no PVC
  type: persistentVolumeClaim
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/output

resources: {}
# Empty by default so the user chooses resources. Uncomment and adjust to set them,
# then remove the braces after `resources:`.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
