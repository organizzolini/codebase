# Defaults for the kubernetes-job chart; a release layers its own values file after this one.
image:
  repository: ""
  # Required: rendering fails while it is empty.
  tag: ""

# Retries before the Job counts as failed, and how long a finished Job stays before it is deleted
backoffLimit: 3
ttlSecondsAfterFinished: 86400

# Name of an existing PriorityClass for the pod; empty omits the field
priorityClassName: ""

# Container arguments, after the image's entrypoint
args: []

# Environment variables, as Kubernetes `env` entries
env: []

# The text of a dotenv file, such as `--set-file envFile=my.env`. It becomes a ConfigMap, mounted read-only at
# envFileMountPath (required with envFile). A ConfigMap is not private, so never put a secret in it; reference a Secret through env.
envFile: ""
envFileMountPath: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 128Mi
