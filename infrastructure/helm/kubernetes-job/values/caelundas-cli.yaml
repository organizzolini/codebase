# Values for the caelundas-cli ingestion Job. Layer after base.yaml:
#   --values values/base.yaml --values values/caelundas-cli.yaml
image:
  repository: ghcr.io/organizzolini/caelundas-cli
  # The release commit fills the tag with the codebase release version.
  tag: ""

job:
  completionMode: Indexed
  parallelism: 1
  backoffLimitPerIndex: 2
  ttlSecondsAfterFinished: 86400

priorityClassName: batch-low

persistence:
  type: emptyDir

# The ingestion workflow sets START_YEAR; Kubernetes sets JOB_COMPLETION_INDEX in every Indexed Job container.
# Each index covers one calendar year, from January 1 through December 31 (END_DATE is inclusive), so
# adjacent indexes neither overlap nor leave a gap. A command replaces the image's entry point, so tini is named here.
command:
  - tini
  - --
  - sh
  - -c
  - >-
    year=$((START_YEAR + JOB_COMPLETION_INDEX));
    export START_DATE="$year-01-01" END_DATE="$year-12-31";
    exec node caelundas-cli.main.js caelundas

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1536Mi

env:
  - name: CAELUNDAS_POSTGRES_HOST
    value: postgres-rw.codebase.svc.cluster.local
  - name: CAELUNDAS_POSTGRES_PORT
    value: "5432"
  - name: CAELUNDAS_POSTGRES_DATABASE
    value: caelundas_staging
  - name: CAELUNDAS_POSTGRES_SCHEMA
    value: caelundas
  - name: CAELUNDAS_POSTGRES_USERNAME
    value: caelundas_username
  - name: CAELUNDAS_POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: caelundas-postgres
        key: password
