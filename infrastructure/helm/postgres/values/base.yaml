# Default values for postgres.
# This is a YAML-formatted file.

# Each entry gets a managed role `<name>_username` and one Database per
# `databases` item, named `<name>_<database>`, with schema `<name>`.
projects:
  - name: caelundas
    databases:
      - production
      - staging

cluster:
  name: postgres
  instances: 1
  # Exact PostgreSQL 18 minor, pinned
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  storage:
    size: 20Gi
    storageClass: linode-block-storage-retain
  resources:
    # Equal, so Postgres is the last pod the kernel kills under memory pressure
    requests:
      memory: 1Gi
    limits:
      memory: 1Gi
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    # PostgreSQL settings; CloudNativePG takes string values only
    parameters:
      shared_buffers: 256MB

backup:
  objectStoreName: postgres-backups
  destinationPath: s3://organizzolini-codebase-postgres-backups/
  endpointURL: https://us-iad-18.linodeobjects.com
  retentionPolicy: 30d
  credentialsSecretName: postgres-backups
  schedule: 0 0 3 * * *
  scheduledBackupName: postgres-daily
  sidecar:
    # Linode Object Storage rejects boto3's default checksums
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

pooler:
  name: postgres-pooler-rw
  instances: 1
  poolMode: transaction
  parameters:
    max_prepared_statements: "100"
    default_pool_size: "10"
    max_client_conn: "100"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
