# Default values for argocd-applications: one Argo CD Application per entry.
# Repository-backed entries use path and valueFiles, relative to the repository root and the chart path.
repoURL: https://github.com/organizzolini/codebase.git
targetRevision: main

applications:
  - name: cert-manager
    syncWave: 0
    namespace: cert-manager
    createNamespace: true
    serverSideApply: true
    chart:
      repoURL: https://charts.jetstack.io
      name: cert-manager
      version: 1.21.3
    helmParameters:
      - name: crds.enabled
        value: "true"

  - name: cloudnative-pg
    syncWave: 1
    namespace: cnpg-system
    createNamespace: true
    chart:
      repoURL: https://cloudnative-pg.github.io/charts
      name: cloudnative-pg
      version: 0.29.1

  - name: plugin-barman-cloud
    syncWave: 2
    namespace: cnpg-system
    createNamespace: true
    chart:
      repoURL: https://cloudnative-pg.github.io/charts
      name: plugin-barman-cloud
      version: 0.8.1

  - name: postgres
    syncWave: 3
    namespace: codebase
    path: infrastructure/helm/postgres
    valueFiles:
      - values/base.yaml

  - name: cloudflared
    syncWave: 4
    namespace: codebase
    path: infrastructure/helm/cloudflared
    valueFiles:
      - values/base.yaml

  - name: caelundas-api
    syncWave: 5
    namespace: caelundas
    path: infrastructure/helm/kubernetes-deployment
    valueFiles:
      - values/base.yaml
      - values/caelundas-api.yaml

  - name: caelundas-web
    syncWave: 5
    namespace: caelundas
    path: infrastructure/helm/kubernetes-deployment
    valueFiles:
      - values/base.yaml
      - values/caelundas-web.yaml
