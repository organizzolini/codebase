{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | quote }}
spec:
  project: default
  {{- $referenced := false }}
  {{- range .valueFiles }}
  {{- if hasPrefix "$values/" . }}{{ $referenced = true }}{{ end }}
  {{- end }}
  {{- if $referenced }}
  sources:
    - {{ include "argocd-applications.source" (dict "app" . "root" $) | trim | nindent 6 | trim }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
  {{- else }}
  source:
    {{- include "argocd-applications.source" (dict "app" . "root" $) | trim | nindent 4 }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
      {{- if .createNamespace }}
      - CreateNamespace=true
      {{- end }}
      {{- if .serverSideApply }}
      - ServerSideApply=true
      {{- end }}
{{- end }}
