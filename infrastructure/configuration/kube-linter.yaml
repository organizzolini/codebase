# kube-linter policy for the manifests `helm-releases render` produces.
# The default checks stay on; the ones below are named so a change to kube-linter's
# defaults cannot quietly drop a hardening rule the charts already meet.
checks:
  include:
    - drop-net-raw-capability
    - host-ipc
    - host-network
    - host-pid
    - latest-tag
    - no-read-only-root-fs
    - privilege-escalation-container
    - privileged-container
    - run-as-non-root
    - unset-cpu-requirements
    - unset-memory-requirements
