name: caelundas-images

# The caelundas images: `docker compose build <service>` builds one and `build --push` pushes it.
# The `build-only` profile keeps `up` from starting them. IMAGE_TAG (default local) tags an image.

# IMAGE_CA_BUNDLE is an optional PEM file for a TLS-inspecting proxy; unset, the secret is empty.
x-build: &build
  context: ../..
  dockerfile: infrastructure/docker/application/Dockerfile
  platforms: [linux/amd64]
  labels:
    org.opencontainers.image.source: https://github.com/organizzolini/codebase
  secrets: [ca-bundle]

x-image: &image
  profiles: [build-only]

secrets:
  ca-bundle:
    file: ${IMAGE_CA_BUNDLE:-/dev/null}

services:
  caelundas-api:
    <<: *image
    image: ghcr.io/organizzolini/caelundas-api:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: node
      args:
        PROJECT: caelundas-api
        PROJECT_DIRECTORY: projects/caelundas/caelundas-api
        ENTRY: caelundas-api.js
        # The API's port, read from its .env.default by the project's `docker` target, which passes it as `--env-file`.
        PORT: ${CAELUNDAS_API_PORT:-}
        PORT_VARIABLE: CAELUNDAS_API_PORT
        # The GraphQL schema is written beside the root module at startup; the image links it into its one writable directory so the root filesystem can stay read-only.
        TEMPORARY_PATHS: projects/caelundas/caelundas-api/src/schema.gql

  caelundas-cli:
    <<: *image
    image: ghcr.io/organizzolini/caelundas-cli:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: node
      args:
        PROJECT: caelundas-cli
        PROJECT_DIRECTORY: projects/caelundas/caelundas-cli
        ENTRY: caelundas-cli.main.js caelundas
        REBUILT_PACKAGES: sweph
        # The Swiss Ephemeris files are fetched at build time, so a run never downloads them.
        PREPARE_COMMAND: NODE_USE_ENV_PROXY=1 node /workspace/dist/caelundas-cli/ephemeris-download-cli.main.js ephemeris-download
        RUNTIME_PATHS: data
        # Node sizes its default heap from the container limit, about 760 MB under the Job's 1.5 GiB, which one year's
        # events overrun once stored; 1 GiB leaves the rest for the native ephemeris and buffers.
        RUNTIME_NODE_OPTIONS: --max-old-space-size=1024

  caelundas-web:
    <<: *image
    image: ghcr.io/organizzolini/caelundas-web:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: static
      args:
        PROJECT: caelundas-web
        PROJECT_DIRECTORY: projects/caelundas/caelundas-web
        # The development port of caelundas-web, which project-ports keeps in step with the project's name in its vite.config.mts.
        PORT: 8967
        BUILD_COMMAND: pnpm exec vite build --config configuration/vite.config.mts
        OUTPUT_PATH: dist/client
        # Vite reads VITE_ variables when it builds, so the API address is baked into the JavaScript.
        BUILD_ENVIRONMENT: VITE_CAELUNDAS_API_URL=${VITE_CAELUNDAS_API_URL:-https://caelundas.organizzolini.net/graphql}
