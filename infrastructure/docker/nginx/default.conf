# Replaces the image's default server block at /etc/nginx/conf.d/default.conf.
server {
    # IPv4 only: the image's entrypoint leaves a changed default.conf alone, so no IPv6 listener is added.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Vite names built files by content hash, so a changed file gets a new URL. A 404 is not cached as immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is the single-page app's shell, so the page and each fallback stay uncached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
