query Meanders(
  $first: Int
  $after: String
  $offset: Int
  $sort: MeanderSortInput
  $filter: MeanderFilterGroupInput
  $repeats: Int
) {
  meanders(
    first: $first
    after: $after
    offset: $offset
    sort: $sort
    filter: $filter
  ) {
    totalCount
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      cursor
      node {
        code
        columns
        id
        isHardcoded
        lattice
        repeats
        rows
        svg(repeats: $repeats)
        characteristics {
          isPattern
          key
          name
          value
        }
      }
    }
  }
}
