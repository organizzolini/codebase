# Values for the caelundas-api Deployment.
# Layered over infrastructure/helm/kubernetes-deployment/values/base.yaml.
# The helm-releases command reads `chart`; the chart ignores it.
chart: kubernetes-deployment
image:
  repository: ghcr.io/organizzolini/caelundas-api

# Lightship serves probes on 9000, separate from the application port
probes:
  liveness:
    path: /live
    port: 9000
  readiness:
    path: /ready
    port: 9000

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

# Every application listens on the chart's containerPort (8080) in production; the API reads it from here, while locally its port is derived from its name
env:
  - name: CAELUNDAS_API_PORT
    value: "8080"
  - name: CAELUNDAS_POSTGRES_HOST
    value: postgres-pooler-rw.organizzolini.svc.cluster.local
  - name: CAELUNDAS_POSTGRES_DATABASE
    value: caelundas_production
  - name: CAELUNDAS_POSTGRES_SCHEMA
    value: caelundas
  - name: CAELUNDAS_POSTGRES_USERNAME
    value: caelundas_username
  - name: CAELUNDAS_POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: caelundas-postgres
        key: password
