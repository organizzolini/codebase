fragment FilterCollectionFields on EventFilterCollection {
  description
  id
  name
  filter {
    ...FilterGroupFields
    groups {
      ...FilterGroupFields
      groups {
        ...FilterGroupFields
      }
    }
  }
}

fragment FilterGroupFields on EventFilterGroup {
  combinator
  rules {
    negated
    operator
    path
    values
  }
}

query FilterCollections {
  defaultFilterCollection {
    ...FilterCollectionFields
  }
  filterCollections {
    ...FilterCollectionFields
  }
}
