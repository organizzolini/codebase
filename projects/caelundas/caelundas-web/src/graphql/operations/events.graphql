query Events(
  $period: PeriodInput!
  $filter: EventFilterGroupInput
  $grouping: EventGroupingInput
) {
  events(period: $period, filter: $filter, grouping: $grouping) {
    note
    durationMinutes
    end
    id
    start
    startLocalDay
    startLocalHour
    name
    timezone
    groups {
      key
      label
      rank
      path
    }
    tags {
      depth
      id
      name
      path
    }
  }
}
