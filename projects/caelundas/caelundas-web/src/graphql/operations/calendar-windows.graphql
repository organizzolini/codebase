query CalendarWindows(
  $anchor: DateTime!
  $view: CalendarView
  $scale: TimelineScale
  $agendaDays: Int
) {
  calendarWindows(
    anchor: $anchor
    view: $view
    scale: $scale
    agendaDays: $agendaDays
  ) {
    columnMinutes
    visible {
      end
      start
    }
    window {
      end
      start
    }
  }
}
