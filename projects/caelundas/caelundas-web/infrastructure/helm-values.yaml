# Values for the caelundas-web Deployment.
# Layered over infrastructure/helm/kubernetes-deployment/values/base.yaml.
# The helm-releases command reads `chart`; the chart ignores it.
chart: kubernetes-deployment
image:
  repository: ghcr.io/organizzolini/caelundas-web

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Unprivileged nginx writes its pid file to the temporary directory and its request buffers to /var/cache/nginx
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache/nginx
