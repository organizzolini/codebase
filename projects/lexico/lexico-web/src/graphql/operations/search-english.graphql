query SearchEnglish($query: String!, $first: Int!) {
  searchEnglish(query: $query, first: $first) {
    edges {
      node {
        enclitic
        identifiers
        score
        source
        lexeme {
          id
          etymology
          lemma
          partOfSpeech
          inflection {
            ... on AdjectiveInflection {
              declension
              degree
            }
            ... on AdverbInflection {
              adverbType
              degree
            }
            ... on NounInflection {
              declension
              gender
            }
            ... on PrepositionInflection {
              case
            }
            ... on VerbInflection {
              conjugation
              other
            }
          }
          principalParts {
            text
          }
          pronunciations {
            phonetic
            variant
          }
          translations {
            data
          }
        }
      }
    }
  }
}
