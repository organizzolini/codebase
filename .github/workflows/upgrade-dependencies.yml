name: 🧑‍🚒 Upgrade Dependencies

on:
  schedule:
    - cron: 18 8 * * 5
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: 🧑‍🚒 Upgrade Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      # Runs each upgrade in turn (pnpm, node, Python, lockfile, Python dependencies,
      # skills). A failed upgrade is undone and the rest still run; the pull
      # request lists what was skipped. The job fails only when an undo fails.
      - name: ⬆️ Upgrade Dependencies
        id: upgrade
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts upgrade-dependencies

      - name: 🔐 Import GPG Key
        id: import-gpg
        if: steps.upgrade.outputs.has_dependency_updates == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Open Pull Request
        if: steps.upgrade.outputs.has_dependency_updates == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          # The key imported above signs the commit locally. This step takes about 20
          # minutes, almost all in the pre-commit hook, which runs every check on all
          # 58 projects. The cache helps little: the hook hit 16% of its tasks warm.
          commit-message: "chore(dependencies): ⬆️ upgrade"
          branch: chore/dependencies-upgrade
          delete-branch: true
          title: "chore(dependencies): ⬆️ upgrade"
          body-path: ${{ steps.upgrade.outputs.body_path }}
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Comply requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            dependencies
            automated
            type:chore
            scope:dependencies
            source:agent
          assignees: JimmyPaolini
