name: 🧑‍🚒 Upgrade Dependencies

on:
  schedule:
    - cron: 18 8 * * 5
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: 🧑‍🚒 Upgrade Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      # Every upgrade below runs through `best-effort`: the step's script runs,
      # and when it fails the files it may change (`BEST_EFFORT_PATHS`) are put
      # back as they were just before it, the failure is recorded, and the job
      # carries on. One broken upgrade must not stop the others, as the
      # Python bump once stopped the skills. `📝 Report Skipped Steps` writes
      # what was skipped into the pull request, so a failing step shows up
      # there rather than as a quiet success.

      # The new version is only worth keeping if pnpm can switch to it, which
      # its minimumReleaseAge refuses for a release under a day old.
      - name: 🎁 Upgrade pnpm
        env:
          BEST_EFFORT_LABEL: Upgrade pnpm
          BEST_EFFORT_PATHS: package.json
          BEST_EFFORT_RUN: |
            jq --arg v "pnpm@$(pnpm view pnpm version)" \
              '.packageManager = $v' package.json > package.json.temporary
            mv package.json.temporary package.json
            pnpm --version
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      - name: 🟢 Upgrade node
        env:
          BEST_EFFORT_LABEL: Upgrade node
          BEST_EFFORT_PATHS: package.json
          BEST_EFFORT_RUN: |
            test -n "${LATEST_NODE:-}" || {
              echo "LATEST_NODE is not set, and nothing in this repository sets it." >&2
              exit 1
            }
            jq --arg v ">=${LATEST_NODE}" '.engines.node = $v' \
              package.json > package.json.temporary
            mv package.json.temporary package.json
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      # The bump moves every Python version setting, upper bound included, to
      # the newest stable release, then `uv sync` proves the lockfile installs
      # on it, since a lock alone would not catch a dependency with no wheel
      # (ormsgpack, #1491). On failure the files go back and the recovery
      # rebuilds the current environment, so the hooks that run in
      # `🔀 Open Pull Request` still find a working .venv.
      - name: 🐍 Upgrade Python
        env:
          BEST_EFFORT_LABEL: Upgrade Python
          BEST_EFFORT_PATHS: >-
            projects/affirmancy/pyproject.toml
            configuration/conformetry-templates/jupyter-notebook-application/{{nameKebabCase}}/pyproject.toml
            configuration/pyproject.toml
            configuration/uv.lock
          BEST_EFFORT_RECOVER: uv sync --frozen --quiet --project configuration
          BEST_EFFORT_RUN: |
            uv python install 3 --upgrade
            LATEST_PYTHON=$(uv run --no-project --python 3 python -c "
            import sys
            v=sys.version_info
            print(f'{v.major}.{v.minor}')
            ")
            PYTHON_VER=$(echo "$LATEST_PYTHON" | tr -d '.')
            NEXT_PYTHON="3.$(( ${LATEST_PYTHON#3.} + 1 ))"

            # The template must stay identical to the application it generates.
            for file in \
              projects/affirmancy/pyproject.toml \
              "configuration/conformetry-templates/jupyter-notebook-application/{{nameKebabCase}}/pyproject.toml"
            do
              sed -i "s/^requires-python = .*/requires-python = \">=${LATEST_PYTHON},<${NEXT_PYTHON}\"/" "$file"
            done

            sed -i "s/target-version = \"py[0-9][0-9]*/target-version = \"py${PYTHON_VER}/" configuration/pyproject.toml
            sed -i "s/pythonVersion = \"3\.[0-9][0-9]*/pythonVersion = \"${LATEST_PYTHON}/" configuration/pyproject.toml

            uv lock --project configuration
            uv sync --frozen --quiet --project configuration
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      # Per-package npm and GitHub Actions version bumps now come from
      # Dependabot (.github/dependabot.yml) as their own isolated pull
      # requests, not from a bulk `pnpm update --latest --recursive` here —
      # see that file for why, and for where the typescript and
      # eslint-plugin-unicorn holds now live. This step only dedupes: it
      # reaches transitive dependencies that individual Dependabot bumps
      # cannot, since a transitive package satisfying its parents' ranges
      # stays pinned even as its parents move — how a vulnerable copy
      # survives a run of successful upgrades.
      #
      # `nx show projects` is the cheapest thing that proves the dedupe did
      # not break Nx itself. Loading the project graph loads every workspace
      # plugin, so failing here names the dedupe as the cause while the diff
      # is still on disk, rather than inside the husky pre-commit hook of
      # `🔀 Open Pull Request`, reported as `Unexpected error: pre-commit`.
      # There is no `--configuration=check` lint gate: that commit fires
      # pre-commit, which runs the whole gate already.
      - name: 📦 Deduplicate Lockfile
        env:
          BEST_EFFORT_LABEL: Deduplicate lockfile
          BEST_EFFORT_PATHS: pnpm-lock.yaml
          BEST_EFFORT_RUN: |
            pnpm dedupe
            pnpm exec nx show projects
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      - name: 📦 Upgrade Python Dependencies
        env:
          BEST_EFFORT_LABEL: Upgrade Python dependencies
          BEST_EFFORT_PATHS: configuration/uv.lock
          # One lockfile covers every uv workspace member.
          BEST_EFFORT_RUN: uv lock --upgrade --project configuration
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      - name: 🤹 Upgrade Skills
        env:
          BEST_EFFORT_LABEL: Upgrade skills
          BEST_EFFORT_PATHS: .agents skills-lock.json agent
          BEST_EFFORT_RUN: |
            pnpm exec skills update --yes
            # The skills CLI has a bug when no agents are detected and --yes is passed:
            # it falls back to installing for ALL agents. For the 'eve' agent, it
            # hardcodes canonicalBase to agent/skills, creating an untracked agent/ folder.
            # This violates eslint-plugin-project-structure rules in the pre-commit hook.
            # We remove it here until the CLI is fixed.
            rm -rf agent/
            # ReUI serves its skill as a JSON bundle rather than a GitHub source, so
            # `skills update` skips it; the installation project's
            # `update-reui-skill` command re-fetches and re-pins it.
            NODE_OPTIONS='' node --import @swc-node/register/esm-register \
              installation/src/installation.main.ts update-reui-skill
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      - name: 🎨 Upgrade Impeccable
        env:
          BEST_EFFORT_LABEL: Upgrade Impeccable
          BEST_EFFORT_PATHS: .agents skills-lock.json
          BEST_EFFORT_RUN: npx impeccable update
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort

      - name: 📝 Report Skipped Steps
        id: skipped
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts best-effort-report

      # Untracked files count: an upgrade that only adds a file, such as a new
      # skill, still has something to open a pull request for.
      - name: 🔍 Detect Upgrades
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_dependency_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_dependency_updates=true" >> $GITHUB_OUTPUT
          fi

      # Skipped steps with nothing else to ship leave no pull request to carry
      # the write-up, so the run itself has to be the one that says so.
      - name: 🚨 Fail When Nothing Shipped
        if: >-
          steps.check.outputs.has_dependency_updates != 'true' &&
          steps.skipped.outputs.count != '0'
        run: |
          echo "::error::${SKIPPED_COUNT} upgrade step(s) were skipped and nothing else changed, so there is no pull request to report them in."
          exit 1
        env:
          SKIPPED_COUNT: ${{ steps.skipped.outputs.count }}

      # Written to a file rather than given as `body:` so the skipped steps can
      # lead the details and close the body, where a reviewer cannot miss them,
      # without an empty line in the middle of the list when there are none.
      - name: 📝 Write Pull Request Body
        if: steps.check.outputs.has_dependency_updates == 'true'
        env:
          SKIPPED_COUNT: ${{ steps.skipped.outputs.count }}
          SKIPPED_DETAILS: ${{ steps.skipped.outputs.details }}
          SKIPPED_SECTION: ${{ steps.skipped.outputs.section }}
          WORKFLOW_URL: ${{ format('https://github.com/{0}/actions/workflows/{1}', github.repository, 'upgrade-dependencies.yml') }}
        run: |
          {
            echo "## 🌰 Summary"
            echo
            echo "Automated toolchain updates detected by the weekly dependency check."
            echo "Per-package npm and GitHub Actions bumps arrive separately, as their"
            echo "own Dependabot pull requests."
            if [ "${SKIPPED_COUNT:-0}" != "0" ]; then
              echo "⚠️ ${SKIPPED_COUNT} upgrade step(s) were skipped; see Skipped Upgrades below."
            fi
            echo
            echo "## 📝 Details"
            echo
            if [ -n "${SKIPPED_DETAILS}" ]; then
              echo "${SKIPPED_DETAILS}"
            fi
            echo "- Update node to latest patch of current major"
            echo "- Update pnpm to latest version"
            echo "- Deduplicate the lockfile so in-range transitive upgrades land"
            echo "- Update pnpm lockfile"
            echo "- Update Python to latest stable 3.x when every dependency supports it"
            echo "- Update Python dependencies across all projects"
            echo "- Update vendored skills from their upstream sources"
            echo "- Update the Impeccable skill bundle to the latest release"
            echo
            echo "## 🧪 Testing"
            echo
            echo "1. Review changes in the diff"
            echo "2. Verify all code checks pass"
            echo "3. Test functionality manually (if needed)"
            echo
            echo "## 🔗 Related"
            echo
            echo "- *Generated by [🧑‍🚒 Upgrade Dependencies](${WORKFLOW_URL})*"
            if [ -n "${SKIPPED_SECTION}" ]; then
              echo
              echo "${SKIPPED_SECTION}"
            fi
          } > "${RUNNER_TEMP}/pull-request-body.md"

      - name: 🔐 Import GPG Key
        id: import-gpg
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Open Pull Request
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          sign-commits: true
          commit-message: "chore(dependencies): ⬆️ Upgrade"
          branch: chore/dependencies-upgrade
          delete-branch: true
          title: "chore(dependencies): ⬆️ Upgrade"
          body-path: ${{ runner.temp }}/pull-request-body.md
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Validate Conventions requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            dependencies
            automated
            type:chore
            scope:dependencies
            source:agent
          assignees: JimmyPaolini
