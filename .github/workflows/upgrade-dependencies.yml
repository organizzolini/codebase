name: 🧑‍🚒 Upgrade Dependencies

on:
  schedule:
    - cron: 18 8 * * 5
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: 🧑‍🚒 Upgrade Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      # Runs each upgrade in turn: pnpm, node, Python, the lockfile, Python
      # dependencies, skills, and Impeccable. One that fails is undone and the
      # rest still run, and the pull request it writes says which were
      # skipped. It fails the job only when a failed step could not be undone,
      # or when skipped steps are all there is to report.
      - name: ⬆️ Upgrade Dependencies
        id: upgrade
        run: NODE_OPTIONS='' node --import @swc-node/register/esm-register integration/src/integration.main.ts upgrade-dependencies

      - name: 🔐 Import GPG Key
        id: import-gpg
        if: steps.upgrade.outputs.has_dependency_updates == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Open Pull Request
        if: steps.upgrade.outputs.has_dependency_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          sign-commits: true
          commit-message: "chore(dependencies): ⬆️ Upgrade"
          branch: chore/dependencies-upgrade
          delete-branch: true
          title: "chore(dependencies): ⬆️ Upgrade"
          body-path: ${{ steps.upgrade.outputs.body_path }}
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Validate Conventions requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            dependencies
            automated
            type:chore
            scope:dependencies
            source:agent
          assignees: JimmyPaolini
