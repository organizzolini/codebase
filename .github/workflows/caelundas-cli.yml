name: 🔭 caelundas-cli

on:
  workflow_dispatch:
    inputs:
      environment:
        description: |
          The caelundas-cli dotenv text, one NAME="value" per line. For example:
          LATITUDE="39.949309"
          LONGITUDE="-75.17169"
          START_DATE="2026-07-01"
          END_DATE="2026-07-31"
        required: true
        default: |
          LATITUDE="39.949309"
          LONGITUDE="-75.17169"
          START_DATE="2026-07-01"
          END_DATE="2026-07-31"
        type: string

permissions:
  contents: read

jobs:
  ingest:
    name: 🔭 caelundas-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The input is written to a file through `env:`, never spliced into a command, and mounted into the Job as
      # configuration/.env. The CLI's own schema validates every value.
      - name: 📝 Write Environment File
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: printf '%s' "$ENVIRONMENT" > "$RUNNER_TEMP/caelundas-cli.env"

      # The GitHub-hosted runner ships kubectl and helm, and nothing here needs
      # a particular version of either, so neither is installed or pinned.
      - name: 🔑 Set Kubernetes Context
        uses: azure/k8s-set-context@5f008dfddbbc9df61ba40a7aaa912c6033ba62fc # v5.0.2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # `helm template` shows the image the release would run. The chart
      # renders `repository:tag`, so an empty tag ends in a colon.
      - name: 🚀 Install caelundas-cli Release
        env:
          RELEASE: caelundas-cli-${{ github.run_id }}
        run: |
          set -euo pipefail
          chart_arguments=(
            infrastructure/helm/kubernetes-job -n caelundas
            -f infrastructure/helm/kubernetes-job/values/base.yaml
            -f infrastructure/helm/kubernetes-job/values/caelundas-cli.yaml
            --set-file envFile="$RUNNER_TEMP/caelundas-cli.env"
          )
          image="$(helm template "$RELEASE" "${chart_arguments[@]}" --show-only templates/job.yaml \
            | sed -n 's/^ *image: "\(.*\)"$/\1/p')"
          if [[ "$image" != *:?* ]]; then
            echo "::error::no caelundas-cli release yet"
            exit 1
          fi
          helm install "$RELEASE" "${chart_arguments[@]}"
          helm get notes "$RELEASE" -n caelundas >> "$GITHUB_STEP_SUMMARY"
