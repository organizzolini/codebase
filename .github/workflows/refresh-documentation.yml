name: 🧑‍🏫 Refresh Documentation

on:
  schedule:
    - cron: 18 8 * * 5 # Weekly Friday 8:18am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-documentation:
    name: 🧑‍🏫 Refresh Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The OpenRouter preset that Terraform keeps (infrastructure/terraform),
      # whose ranked list starts with the free Nemotron 3 Ultra, never billed.
      # Terraform sets the variable, so change the models there. Free models
      # are capped at 20 requests a minute and, once $10 of credit has been
      # bought, 1,000 a day. A free endpoint can go down or be gated to
      # approved apps, so a failed run is worth checking the model's health.
      # The retry count is high so that backing off outlasts a spent minute.
      OPENWIKI_PROVIDER: openrouter
      OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENWIKI_MAX_OUTPUT_TOKENS: "16384"
      OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "12"
      OPENWIKI_TELEMETRY_DISABLED: "true"
      # Groups every OpenRouter request of this run in its Sessions view. The
      # OpenRouter client in OpenWiki reads this variable by itself.
      OPENROUTER_SESSION_ID: ${{ github.repository }}/refresh-documentation/${{ github.run_id }}/${{ github.run_attempt }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🧑‍🏫 Refresh Documentation
        run: pnpm exec nx run documentation:refresh-documentation

      # The repository requires signed commits, and its pre-commit hook rejects
      # an unsigned one, which the action makes locally before it pushes. The
      # key is imported here, after the model has finished, so it is not in the
      # job while the model's tools run.
      - name: 🔐 Import GPG Key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Upsert Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          sign-commits: true
          base: main
          branch: docs/documentation-refresh
          delete-branch: true
          commit-message: "docs(documentation): 📝 refresh OpenWiki"
          title: "docs(documentation): 📝 refresh OpenWiki"
          body: |
            ## 🌰 Summary

            Refresh repository documentation with OpenWiki-generated updates.

            ## 📝 Details

            - Install and run OpenWiki in repository code mode
            - Update documentation under `documentation/openwiki/`
            - Reuse the existing scheduled + manual workflow entrypoint
            - Publish changes on `docs/documentation-refresh`

            ## 🧪 Testing

            1. Review the generated diff
            2. Verify the workflow only opens a PR when documentation changes \
               exist
            3. Confirm the OpenWiki update target runs successfully in CI

            ## 🔗 Related

            - *Generated by [🧑‍🏫 Refresh Documentation](${{
              format(
                'https://github.com/{0}/actions/workflows/{1}',
                github.repository,
                'refresh-documentation.yml'
              )
            }})*
          add-paths: |
            documentation/openwiki/**
            AGENTS.md
            .github/workflows/refresh-documentation.yml
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Validate Conventions requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            automated
            type:docs
            scope:documentation
            source:agent
          assignees: JimmyPaolini
