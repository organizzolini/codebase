name: 🧑‍🏫 Refresh Documentation

on:
  schedule:
    - cron: 18 8 * * 5 # Weekly Friday 8:18am UTC
  workflow_dispatch:

# The shared Nx cache's bucket, read-only: a scheduled documentation run has no
# reason to write to what `main` reads.
env:
  NX_SHARED_CACHE_REMOTE_ACCESS_KEY_ID: ${{ secrets.NX_CACHE_READ_ONLY_ACCESS_KEY_ID }}
  NX_SHARED_CACHE_REMOTE_BUCKET: ${{ vars.NX_CACHE_BUCKET }}
  NX_SHARED_CACHE_REMOTE_ENDPOINT: ${{ vars.NX_CACHE_ENDPOINT }}
  NX_SHARED_CACHE_REMOTE_REGION: ${{ vars.NX_CACHE_REGION }}
  NX_SHARED_CACHE_REMOTE_SECRET_ACCESS_KEY: ${{ secrets.NX_CACHE_READ_ONLY_SECRET_ACCESS_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-documentation:
    name: 🧑‍🏫 Refresh Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The OpenRouter preset Terraform keeps (infrastructure/terraform) starts with a free model.
      # Free models allow 20 requests a minute, and the high retry count outlasts a spent minute.
      # A free endpoint can go down or be gated, so check the model's health when a run fails.
      OPENWIKI_PROVIDER: openrouter
      OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENWIKI_MAX_OUTPUT_TOKENS: "16384"
      OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "12"
      # OpenWiki skips a page whose worker fails without saying why. Debug mode
      # prints the provider's error, so a skipped page leaves its cause in the log.
      OPENWIKI_DEBUG: "1"
      OPENWIKI_TELEMETRY_DISABLED: "true"
      # Groups every OpenRouter request of this run in its Sessions view. The
      # OpenRouter client in OpenWiki reads this variable by itself.
      OPENROUTER_SESSION_ID: ${{ github.repository }}/refresh-documentation/${{ github.run_id }}/${{ github.run_attempt }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      # Retries a rate-limited OpenWiki run after the wait OpenRouter reports,
      # and a run that skipped pages, which the next attempt resumes. Writes every
      # attempt to the job summary, and publishes `wiki-changed`, false when only
      # `.last-update.json` and `.page-manifest.json` changed, with the
      # `pages-refreshed` and `pages-total` counts.
      - name: 🧑‍🏫 Refresh Documentation
        id: refresh
        run: pnpm exec nx run documentation:refresh-documentation

      # The repository requires signed commits, and its pre-commit hook rejects
      # an unsigned one, which the action makes locally before it pushes. The
      # key is imported here, after the model has finished, so it is not in the
      # job while the model's tools run.
      - name: 🔐 Import GPG Key
        id: import-gpg
        if: steps.refresh.outputs.wiki-changed != 'false'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      # Skipped when only the wiki's bookkeeping changed, since a pull request
      # for a re-stamped manifest says nothing and costs a review.
      - name: 🔀 Upsert Pull Request
        if: steps.refresh.outputs.wiki-changed != 'false'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          sign-commits: true
          base: main
          branch: docs/documentation-refresh
          delete-branch: true
          commit-message: "docs(documentation): 📝 refresh"
          title: "docs(documentation): 📝 refresh"
          body: |
            ## 🌰 Summary

            Refresh repository documentation with OpenWiki-generated updates.

            ## 📝 Details

            - Install and run OpenWiki in repository code mode
            - Update documentation under `documentation/openwiki/`
            - Refreshed ${{ steps.refresh.outputs.pages-refreshed }} of ${{ steps.refresh.outputs.pages-total }} pages; a skipped page is reconsidered on the next run
            - Reuse the existing scheduled + manual workflow entrypoint
            - Publish changes on `docs/documentation-refresh`

            ## 🧪 Testing

            1. Review the generated diff
            2. Verify the workflow only opens a PR when documentation changes \
               exist
            3. Confirm the OpenWiki update target runs successfully in CI

            ## 🔗 Related

            - *Generated by [🧑‍🏫 Refresh Documentation](${{
              format(
                'https://github.com/{0}/actions/workflows/{1}',
                github.repository,
                'refresh-documentation.yml'
              )
            }})*
          add-paths: |
            documentation/openwiki/**
            AGENTS.md
            .github/workflows/refresh-documentation.yml
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Comply requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            automated
            type:docs
            scope:documentation
            source:agent
          assignees: JimmyPaolini
