name: 🦸 Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  # The identity token pnpm signs each package's npm provenance attestation
  # with; without it, `pnpm publish --provenance` refuses to publish.
  id-token: write
  # The build-provenance attestations and storage records that list each
  # published package on the organization's Linked artifacts page.
  attestations: write
  artifact-metadata: write

# Never cancel a deployment or release run, so releases and applies queue per ref.
# Pull requests run Continuous Integration instead.
#
# The shared Nx cache bucket. Only trusted runs get read-write keys: a pull request
# or a manual run off `main` gets read-only keys.
env:
  NX_SHARED_CACHE_REMOTE_ACCESS_KEY_ID: >-
    ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') && secrets.NX_CACHE_READ_ONLY_ACCESS_KEY_ID || '' }}${{ !((github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && secrets.NX_CACHE_READ_WRITE_ACCESS_KEY_ID || '' }}
  NX_SHARED_CACHE_REMOTE_BUCKET: ${{ vars.NX_CACHE_BUCKET }}
  NX_SHARED_CACHE_REMOTE_ENDPOINT: ${{ vars.NX_CACHE_ENDPOINT }}
  NX_SHARED_CACHE_REMOTE_REGION: ${{ vars.NX_CACHE_REGION }}
  NX_SHARED_CACHE_REMOTE_SECRET_ACCESS_KEY: >-
    ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') && secrets.NX_CACHE_READ_ONLY_SECRET_ACCESS_KEY || '' }}${{ !((github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && secrets.NX_CACHE_READ_WRITE_SECRET_ACCESS_KEY || '' }}
  NX_SHARED_CACHE_REMOTE_WRITABLE: ${{ !((github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuous-deployment:
    name: ${{ matrix.target.emoji }} ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: build-devcontainer
            name: Devcontainer
            emoji: 🧑‍🏭
            timeout: 20
          # Sized for a release of many packages: a 28-package release once outran a
          # 24-minute limit. A release now takes 15 to 21 minutes, and a timeout before
          # the push leaves nothing behind.
          - id: push-releases
            name: Releases
            emoji: 🦸
            timeout: 32
          # Applies the OpenRouter Terraform when a push to main changes it. State is in
          # a Linode bucket with no lock, so this workflow's per-ref concurrency group,
          # which never cancels, keeps two applies from overlapping.
          - id: apply-terraform
            name: Infrastructure
            emoji: 🏗️
            timeout: 20

    steps:
      # Decides from the GitHub API alone, before any checkout. The devcontainer is
      # built only when the change touches a file its image or test reads, or this
      # workflow. A change set that cannot be read in full builds rather than guessing.
      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TARGET_ID: ${{ matrix.target.id }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$TARGET_ID" = "build-devcontainer" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            BASE="$PUSH_BEFORE"
            HEAD="$SHA"

            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              echo "🧑‍🏭 No previous revision to compare against; building the devcontainer."
            else
              COMPARISON="$(gh api "repos/$REPOSITORY/compare/${BASE}...${HEAD}")"
              FILE_COUNT="$(jq '.files | length' <<< "$COMPARISON")"
              MATCH_PATTERN='^(\.devcontainer/|\.env\.default$|\.github/workflows/continuous-deployment\.yml$|infrastructure/docker/docker-compose\.yml$)'
              PACKAGE_MANAGER_PATTERN='^[-+][[:space:]]*"packageManager"'

              if [ "$FILE_COUNT" -ge 300 ]; then
                echo "🧑‍🏭 ${FILE_COUNT} changed files may be truncated; building the devcontainer."
              elif jq -r '.files[].filename' <<< "$COMPARISON" | grep -qE "$MATCH_PATTERN"; then
                echo "🧑‍🏭 Devcontainer files changed; building the devcontainer."
              elif jq -r '.files[] | select(.filename == "package.json") | .patch // ""' \
                <<< "$COMPARISON" | grep -qE "$PACKAGE_MANAGER_PATTERN"; then
                echo "🧑‍🏭 The packageManager pin changed; building the devcontainer."
              else
                echo "⏭️ No devcontainer changes detected; skipping devcontainer build."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          if [ "$TARGET_ID" = "push-releases" ]; then
            tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            if [ "$tip" != "$SHA" ]; then
              echo "⏭️ $SHA superseded by $tip, whose run releases instead"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "🦸 $SHA holds main's tip, releasing"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Decides what the infrastructure leg has to set up before anything is
      # set up. A push to main is compared with the commit before it, from the
      # clone above; a manual run applies whatever the module holds.
      - name: 🚦 Detect Terraform Changes
        id: terraform-changes
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'apply-terraform' &&
          github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - infrastructure/terraform/**

      # Devcontainer Build & Publish Steps
      - name: 🗂️ Setup Environment File
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: filter
          refFilterForPush: |
            refs/heads/main
          eventFilterForPush: |
            push
            workflow_dispatch
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh

      # Release Steps
      # The one setup of the release and infrastructure legs. The release needs
      # Python and uv; the infrastructure leg needs terraform and neither.
      - name: 🕋 Setup Codebase
        id: setup
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          (matrix.target.id == 'push-releases' ||
          (matrix.target.id == 'apply-terraform' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.terraform-changes.outputs.terraform == 'true')))
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"
          python-dependencies: ${{ matrix.target.id == 'push-releases' && 'true' || 'false' }}
          terraform: ${{ matrix.target.id == 'apply-terraform' && 'true' || 'false' }}
          uv: ${{ matrix.target.id == 'push-releases' && 'true' || 'false' }}

      - name: 🔐 Import GPG Key
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: bash scripts/git/check-commit-signing-configuration.sh

      # Versions the ic-suite packages and writes their changelogs, uncommitted.
      # If `main` moves during the run, later steps skip, since the newer run releases it all.
      # It runs before the build, so npm gets the build of the published manifest.
      - name: 🏷️ Version Packages
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            publication/src/publication.main.ts version-packages

      - name: 👷 Build Projects
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: pnpm exec nx run-many --target=build

      - name: 🔭 Trace Calls
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: pnpm exec nx run configuration:callidescope:write

      - name: 🕸️ Graph Dependencies
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: pnpm exec nx run configuration:codependix:write

      - name: 👔 Inventory Generators
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: |
          pnpm exec nx run-many \
            --target=conformetry-generators \
            --configuration=write

      - name: 🔗 Synchronize
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: |
          pnpm exec nx run-many \
            --target=conventional-config \
            --target=devcontainer-configuration \
            --target=pull-request-template \
            --target=skill-exclusions \
            --configuration=write

      - name: 📊 Measure Code
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write \
            --exclude=configuration
          pnpm exec nx run configuration:codometer:write

      - name: 🪙 Coin Vocabulary
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: |
          pnpm exec nx run-many \
            --target=coinagerie \
            --target=coinagerie-check \
            --configuration=write

      # semantic-release versions and tags the codebase itself, and creates the
      # `v*` release the README badge shows, never an ic-suite package. Its one
      # `chore(release): 🔖 tag codebase` commit also carries the package
      # versions and changelogs the step above wrote, so it comes before
      # anything is published.
      - name: 🔖 Tag Codebase
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            publication/src/publication.main.ts tag-codebase

      # Tags each newly versioned package on the release commit and pushes the
      # tags. The `tag-packages` command of the `publication` project explains
      # the commit it makes when there was no codebase release to carry the
      # versions.
      - name: 🔖 Tag Packages
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        env:
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            publication/src/publication.main.ts tag-packages

      # Publishes each released package to npm with provenance, and to GitHub Packages
      # under the owner's scope. The `publish-packages` command explains why it uses pnpm
      # and why the GitHub Packages copies are renamed. A re-run completes a run that stopped partway.
      - name: 📦 Publish Packages
        id: publish-packages
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases' &&
          env.RELEASE_SUPERSEDED != 'true'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            publication/src/publication.main.ts publish-packages

      # Lists each npm package on the organization's Linked artifacts page and names
      # the ones this run published, for the attestation below. A version already on
      # npm can only be attested by the run that published it, since a re-run skips it.
      - name: 🔗 Link Packages
        id: link-packages
        if: >-
          !cancelled() &&
          contains(fromJSON('["success", "failure"]'), steps.publish-packages.outcome)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            publication/src/publication.main.ts link-packages

      # A GitHub build-provenance attestation for each npm tarball this run published,
      # shown beside its record on the Linked artifacts page. It also runs after a
      # failure in the link step, for whatever that step found.
      - name: 🔏 Attest Packages
        if: >-
          !cancelled() &&
          steps.link-packages.outputs.attest == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/attestation-subjects.txt
          create-storage-record: false

      # Infrastructure Steps
      - name: 🏗️ Apply Terraform
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'apply-terraform' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.terraform-changes.outputs.terraform == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.TERRAFORM_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_openrouter_management_key: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          TF_VAR_state_bucket: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
        # OpenRouter first: the GitHub root reads its outputs.
        run: |
          pnpm exec nx run infrastructure:terraform-apply:openrouter
          pnpm exec nx run infrastructure:terraform-apply:linode
          pnpm exec nx run infrastructure:terraform-apply:github

      # The only save of this workflow's Nx cache, which the next release
      # restores. Every project is built above, at the versions the release
      # commit carries, so it covers the whole graph of that commit.
      - name: 🧹 Cleanup Codebase
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
