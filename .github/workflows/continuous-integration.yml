name: 🧑‍🎤 Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  # The devcontainer leg signs in to the registry to read the image it caches from.
  packages: read
  pull-requests: write
  issues: write

# The shared Nx cache bucket. Only trusted runs get read-write keys: a pull request
# or a manual run off `main` gets read-only keys, which cannot write.
env:
  NX_SHARED_CACHE_REMOTE_ACCESS_KEY_ID: >-
    ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && secrets.NX_CACHE_READ_ONLY_ACCESS_KEY_ID || '' }}${{ !((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))) && secrets.NX_CACHE_READ_WRITE_ACCESS_KEY_ID || '' }}
  NX_SHARED_CACHE_REMOTE_BUCKET: ${{ vars.NX_CACHE_BUCKET }}
  NX_SHARED_CACHE_REMOTE_ENDPOINT: ${{ vars.NX_CACHE_ENDPOINT }}
  NX_SHARED_CACHE_REMOTE_REGION: ${{ vars.NX_CACHE_REGION }}
  NX_SHARED_CACHE_REMOTE_SECRET_ACCESS_KEY: >-
    ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && secrets.NX_CACHE_READ_ONLY_SECRET_ACCESS_KEY || '' }}${{ !((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))) && secrets.NX_CACHE_READ_WRITE_SECRET_ACCESS_KEY || '' }}
  NX_SHARED_CACHE_REMOTE_WRITABLE: ${{ !((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))) }}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  continuous-integration:
    name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check.timeout-minutes || 12 }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        check:
          - target: typecheck-code
            name: Typecheck
            emoji: 🧑‍🎓
          - target: format-code
            name: Format
            emoji: 🧑‍🎨
          - target: lint-code
            name: Lint
            emoji: 🧑‍⚕️
          - target: deprecate-code
            name: Deprecate
            emoji: 🧟
          # guard-code aggregates these five legs. Run as legs of their own they share
          # the runner pool, so each stays inside the default limit.
          # Keep this leg's `targets` equal to `guard-code`'s `dependsOn` in `nx.json`:
          # a gate named in neither is checked by nothing in CI.
          - target: guard-code
            targets: catalog-manifests,lockfile,project-ports,readme-projects,vscode-extensions
            name: Guard
            emoji: 💂
          - target: callidescope-restrict
            name: Callidescope Restrict
            emoji: 🔭
          - target: codependix-bound
            name: Codependix Bound
            emoji: 🕸️
          # A changed conformetry template selects no instance project, because
          # `.nxignore` hides it, so this is the one leg that asks the affected
          # run to add them. See `INCLUDE_TEMPLATES` below.
          - target: conformetry-validate
            name: Conformetry Validate
            emoji: 👔
          # New projects stay in Test Codebase until they are explicitly split
          # into their own suite here.
          - target: test-code
            name: Test Codebase
            emoji: 🧑‍🔬
            exclude: projects/affirmancy/**,projects/caelundas/**,projects/ic-suite/**,projects/lexico/**,projects/meanderaw/**,projects/common/**
            shard: codebase
          - target: test-code
            name: Test Common
            emoji: 🧑‍🔬
            exclude: "*,!projects/common/**"
            shard: common
            postgres-client: true
          - target: test-code
            name: Test Affirmancy
            emoji: 🧑‍🔬
            exclude: "*,!projects/affirmancy/**"
            shard: affirmancy
          - target: test-code
            name: Test Caelundas
            emoji: 🧑‍🔬
            exclude: "*,!projects/caelundas/**"
            shard: caelundas
          - target: test-code
            name: Test IC Suite
            emoji: 🧑‍🔬
            exclude: "*,!projects/ic-suite/**"
            shard: ic-suite
          - target: test-code
            name: Test Lexico
            emoji: 🧑‍🔬
            exclude: "*,!projects/lexico/**"
            shard: lexico
            postgres-client: true
          - target: test-code
            name: Test Meanderaw
            emoji: 🧑‍🔬
            exclude: "*,!projects/meanderaw/**"
            shard: meanderaw
          - target: secure-code
            name: Secure
            emoji: 🕵️
          - target: build-projects
            name: Build
            emoji: 👷
          # Packs every publishable ic-suite package and installs the tarballs into a
          # consumer outside the checkout, then runs its checks. Runs only when an
          # ic-suite package or the check is affected. Never authenticates to a registry.
          - target: verify-publishable-packages
            name: Publishable Packages
            emoji: 🤵
          # Plans the OpenRouter Terraform for a pull request and comments the result.
          # Nothing applies here: Continuous Deployment applies it on `main`. The leg
          # always reports, so it can be a required check; its steps run only for a
          # same-repository pull request, since forks get no secrets.
          - target: plan-terraform
            name: Infrastructure
            emoji: 🧑‍🚀
          # Builds and tests the devcontainer image for a pull request that changes it,
          # without publishing: Continuous Deployment pushes it on `main`. Like the
          # infrastructure leg, it always reports. The slowest build took 9m05s, so 15
          # minutes leaves room without waiting 20 on a hung one.
          - target: build-devcontainer
            name: Devcontainer
            emoji: 🧑‍🏭
            timeout-minutes: 15

    steps:
      # Decides first whether the job has work to do, so the skip decision below knows
      # it up front. Only same-repository pull requests are planned, since a fork gets
      # no secrets. The action reads changed files through the API, so no clone is needed.
      - name: 🚦 Detect Terraform Changes
        id: terraform-changes
        if: >-
          matrix.check.target == 'plan-terraform' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - infrastructure/terraform/**

      - name: 🚦 Detect Devcontainer Changes
        id: devcontainer-changes
        if: >-
          matrix.check.target == 'build-devcontainer' &&
          github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devcontainer:
              - .devcontainer/**
              - .env.default
              - .github/workflows/continuous-deployment.yml
              - infrastructure/docker/docker-compose.yml
              - package.json

      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ matrix.check.target }}
          TERRAFORM_CHANGED: ${{ steps.terraform-changes.outputs.terraform }}
          DEVCONTAINER_CHANGED: ${{ steps.devcontainer-changes.outputs.devcontainer }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RUNS_ENDPOINT="repos/${{ github.repository }}/actions"
            RUNS_ENDPOINT="${RUNS_ENDPOINT}/workflows/continuous-integration.yml"
            LATEST_RUN_ID="$(gh api \
              "${RUNS_ENDPOINT}/runs?event=pull_request&branch=${HEAD_BRANCH}&per_page=1" \
              --jq '.workflow_runs[0].id')"
            if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" != "${{ github.run_id }}" ]; then
              echo "⏭️ Run ${LATEST_RUN_ID} is newer for this pull request."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$TARGET" = "plan-terraform" ] && [ "$TERRAFORM_CHANGED" != "true" ]; then
            echo "⏭️ No Terraform changes to plan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TARGET" = "build-devcontainer" ] && [ "$DEVCONTAINER_CHANGED" != "true" ]; then
            echo "⏭️ No devcontainer changes to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        id: setup
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target != 'build-devcontainer'
        uses: ./.github/actions/setup-codebase
        with:
          gitleaks: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          trivy: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          python-dependencies: >-
            ${{ matrix.check.target != 'build-projects' &&
            matrix.check.target != 'verify-publishable-packages' &&
            matrix.check.target != 'plan-terraform' && 'true' || 'false' }}
          postgres-client: >-
            ${{ matrix.check['postgres-client'] && 'true' || 'false' }}
          uv: ${{ matrix.check.target != 'plan-terraform' && 'true' || 'false' }}
          # The infrastructure project's `terraform-format` and
          # `terraform-validate` run as part of lint-code, and the runner image
          # no longer ships terraform.
          terraform: >-
            ${{ (matrix.check.target == 'lint-code' ||
            matrix.check.target == 'plan-terraform') && 'true' || 'false' }}
          nx-cache: "true"
          nx-cache-scope: >-
            ${{ github.job }}-${{ matrix.check.target }}${{ matrix.check.shard
            && format('-{0}', matrix.check.shard) || '' }}
          nx-graph-cache: "true"
          nx-shas: "true"
          nx-base: push-before
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'plan-terraform'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.TERRAFORM_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_openrouter_management_key: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          TF_VAR_state_bucket: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
        run: |
          pnpm exec nx run infrastructure:terraform-plan:openrouter
          pnpm exec nx run infrastructure:terraform-plan:github
          pnpm exec nx run infrastructure:terraform-plan:linode

      # Posts each root's plan as one comment that every push updates. A
      # failed plan fails the leg above and shows in its log instead.
      - name: 📊 Report OpenRouter Plan
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'plan-terraform'
        uses: borchero/terraform-plan-comment@v3
        with:
          token: ${{ github.token }}
          working-directory: infrastructure/terraform/openrouter
          planfile: plan.tfplan
          header: 🏗️ Terraform Plan (OpenRouter)

      - name: 📊 Report GitHub Plan
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'plan-terraform'
        uses: borchero/terraform-plan-comment@v3
        with:
          token: ${{ github.token }}
          working-directory: infrastructure/terraform/github
          planfile: plan.tfplan
          header: 🏗️ Terraform Plan (GitHub)

      - name: 📊 Report Linode Plan
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'plan-terraform'
        uses: borchero/terraform-plan-comment@v3
        with:
          token: ${{ github.token }}
          working-directory: infrastructure/terraform/linode
          planfile: plan.tfplan
          header: 🏗️ Terraform Plan (Linode)

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'secure-code'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: pnpm exec nx run configuration:secure-code-ci

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'verify-publishable-packages'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
          PUBLISHABLE_PACKAGES_CONSUMER_ROOT: ${{ runner.temp }}/publishable-packages
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            integration/src/integration.main.ts publishable-packages-gate

      - name: 🗂️ Setup Environment File
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'build-devcontainer'
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'build-devcontainer'
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'build-devcontainer'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh

      # Nx's task-based affected selects each task by its own inputs, so this
      # only adds the one correction it cannot make: a changed conformetry
      # template selects no instance project, because `.nxignore` hides it. See
      # the `run-affected` command of the `integration` project.
      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        id: run-check
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target != 'secure-code' &&
          matrix.check.target != 'verify-publishable-packages' &&
          matrix.check.target != 'plan-terraform' &&
          matrix.check.target != 'build-devcontainer'
        continue-on-error: ${{ matrix.check.target == 'build-projects' }}
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
          TARGET: ${{ matrix.check.targets || matrix.check.target }}
          INCLUDE_TEMPLATES: ${{ matrix.check.target == 'conformetry-validate' }}
          ARGUMENTS: >-
            ${{ matrix.check.target == 'test-code' && '--configuration=coverage'
            || matrix.check.target != 'build-projects' && '--configuration=check'
            || '' }} --parallel=4 ${{ matrix.check.exclude
            && format('--exclude={0}', matrix.check.exclude) || '' }}
        shell: bash
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            integration/src/integration.main.ts run-affected

      - name: 📊 Report Integration
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          (matrix.check.target == 'build-projects' ||
          matrix.check.target == 'typecheck-code' ||
          matrix.check.target == 'test-code')
        uses: ./.github/actions/report-integration
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-main-branch: ${{ github.ref == 'refs/heads/main' }}
          is-pull-request: ${{ github.event_name == 'pull_request' }}
          run-outcome: ${{ steps.run-check.outcome }}
          pull-request-number: ${{ github.event.pull_request.number }}
          target: ${{ matrix.check.target }}
          shard: ${{ matrix.check.shard }}

      # A merge group runs on its own ref, so its cache saves are read by no later run
      # and would evict `main`'s entries. It restores `main`'s caches, saves none, and
      # imports the pull request's cache from the artifact that run uploads.
      - name: 🧹 Cleanup Codebase
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target != 'build-devcontainer'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache: ${{ github.event_name == 'merge_group' && 'false' || 'true' }}
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
          nx-cache-scope: ${{ steps.setup.outputs.nx-cache-scope }}
          nx-cache-artifact: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
            && 'true' || 'false' }}
          eslint-cache: >-
            ${{ matrix.check.target == 'lint-code' &&
            github.event_name != 'merge_group' && 'true' || 'false' }}
