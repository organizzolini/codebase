name: 🧑‍🎤 Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  continuous-integration:
    name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check.timeout-minutes || 12 }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        check:
          - target: typecheck-code
            name: Typecheck
            emoji: 🧑‍🎓
          - target: format-code
            name: Format
            emoji: 🧑‍🎨
          - target: lint-code
            name: Lint
            emoji: 🧑‍🔧
          - target: deprecate-code
            name: Deprecate
            emoji: 🧟
          # Guard runs cold whenever a change reaches the shared configuration
          # project, and cold it sits near the 12-minute limit: a cold run took
          # 10m29s, and runs were cancelled at the limit with every finished
          # task passing. Warm it takes about two. 20 minutes covers a cold
          # run with the setup and cleanup around it.
          - target: guard-code
            name: Guard
            emoji: 💂
            timeout-minutes: 20
          # Tests run in four legs that together cover every project once, so
          # none waits for a free `--parallel` slot behind the slow ones.
          # Meanderaw alone took over seven minutes uncached beside the rest,
          # and about three alone. ic-suite's 37 packages were most of what
          # remained. Caelundas's command line cannot start until its
          # ephemeris download finishes, so it ran last and alone for four more
          # minutes. Its leg takes the whole folder, so a new project joins it.
          # The fourth leg, everything else, keeps the `Test` name branch
          # protection has always required. A leg with nothing affected runs
          # nothing.
          - target: test-code
            name: Test
            emoji: 🧑‍🔬
            exclude: meanderaw-cli,projects/caelundas/**,projects/ic-suite/**
          - target: test-code
            name: Test Caelundas
            emoji: 🧑‍🔬
            exclude: "*,!projects/caelundas/**"
            shard: caelundas
          - target: test-code
            name: Test Meanderaw
            emoji: 🧑‍🔬
            exclude: "*,!meanderaw-cli"
            shard: meanderaw-cli
          - target: test-code
            name: Test IC Suite
            emoji: 🧑‍🔬
            exclude: "*,!projects/ic-suite/**"
            shard: ic-suite
          - target: secure-code
            name: Secure
            emoji: 🕵️
          - target: build-projects
            name: Build
            emoji: 👷
          # Packs every publishable ic-suite package and installs the tarballs
          # into a consumer outside the checkout, then runs its command lines
          # and one inferred target per Nx plugin. Runs whole, and only when an
          # ic-suite package or the check is affected — see
          # `scripts/nx/verify-publishable-packages.sh`. Never authenticates to
          # a registry: no step is given an npm token, and setup-node is given
          # no `registry-url`. Its first run on #1473 took 4m05s with nothing
          # cached: 2m49s to pack and check, 34s of that in the consumer. 15
          # minutes leaves room for a runner several times slower.
          - target: verify-publishable-packages
            name: Publishable Packages
            emoji: 📦
            timeout-minutes: 15

    steps:
      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RUNS_ENDPOINT="repos/${{ github.repository }}/actions"
            RUNS_ENDPOINT="${RUNS_ENDPOINT}/workflows/continuous-integration.yml"
            LATEST_RUN_ID="$(gh api \
              "${RUNS_ENDPOINT}/runs?event=pull_request&branch=${HEAD_BRANCH}&per_page=1" \
              --jq '.workflow_runs[0].id')"
            if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" != "${{ github.run_id }}" ]; then
              echo "⏭️ Run ${LATEST_RUN_ID} is newer for this pull request."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        id: setup
        if: steps.check-skip.outputs.skip != 'true'
        uses: ./.github/actions/setup-codebase
        with:
          gitleaks: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          trivy: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          python-dependencies: >-
            ${{ matrix.check.target != 'build-projects' &&
            matrix.check.target != 'verify-publishable-packages' && 'true' ||
            'false' }}
          postgres-client: >-
            ${{ matrix.check.target == 'test-code' && !matrix.check.shard &&
            'true' || 'false' }}
          uv: "true"
          nx-cache: "true"
          nx-cache-scope: >-
            ${{ github.job }}-${{ matrix.check.target }}${{ matrix.check.shard
            && format('-{0}', matrix.check.shard) || '' }}
          nx-graph-cache: "true"
          nx-shas: "true"
          nx-base: push-before
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'secure-code'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: pnpm exec nx run codebase:secure-code-ci

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'verify-publishable-packages'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
          PUBLISHABLE_PACKAGES_CONSUMER_ROOT: ${{ runner.temp }}/publishable-packages
        run: bash scripts/nx/verify-publishable-packages.sh

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        id: run-check
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target != 'secure-code' &&
          matrix.check.target != 'verify-publishable-packages'
        continue-on-error: ${{ matrix.check.target == 'build-projects' }}
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        uses: ./.github/actions/run-affected
        with:
          target: ${{ matrix.check.target }}
          include-spelling: ${{ matrix.check.target == 'format-code' }}
          include-templates: ${{ matrix.check.target == 'guard-code' }}
          arguments: >-
            ${{ matrix.check.target == 'test-code' && '--configuration=coverage'
            || matrix.check.target != 'build-projects' && '--configuration=check'
            || '' }} --parallel=4 ${{ matrix.check.exclude
            && format('--exclude={0}', matrix.check.exclude) || '' }}

      - name: 📊 Report Integration
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          (matrix.check.target == 'build-projects' ||
          matrix.check.target == 'typecheck-code' ||
          matrix.check.target == 'test-code')
        uses: ./.github/actions/report-integration
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-main-branch: ${{ github.ref == 'refs/heads/main' }}
          is-pull-request: ${{ github.event_name == 'pull_request' }}
          run-outcome: ${{ steps.run-check.outcome }}
          pull-request-number: ${{ github.event.pull_request.number }}
          target: ${{ matrix.check.target }}
          shard: ${{ matrix.check.shard }}

      # A merge group runs on its own `gh-readonly-queue/...` ref, new for every
      # group, and a cache saved there is readable by no later run: later
      # groups and pull requests see their own refs and `main`'s. Saving only
      # filled the repository's 10 GB quota (a third of it, measured) and
      # pushed out the entries `main` saves for everyone else, so a merge
      # group still restores `main`'s caches but saves none of its own. It imports
      # the pull request's instead, from the artifact the pull request's run
      # uploads here.
      - name: 🧹 Cleanup Codebase
        if: always() && steps.check-skip.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache: ${{ github.event_name == 'merge_group' && 'false' || 'true' }}
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
          nx-cache-scope: ${{ steps.setup.outputs.nx-cache-scope }}
          nx-cache-artifact: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
            && 'true' || 'false' }}
          eslint-cache: >-
            ${{ matrix.check.target == 'lint-code' &&
            github.event_name != 'merge_group' && 'true' || 'false' }}
