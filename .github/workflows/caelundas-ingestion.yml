name: 🔭 caelundas-cli

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to ingest
        required: true
        type: number
      end_year:
        description: Last calendar year to ingest (start_year or later)
        required: true
        type: number
      environment:
        description: |
          Extra container environment, one NAME=value per line, such as
          LATITUDE=39.9 and LONGITUDE=-75.2. The CLI validates it.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ingest:
    name: 🔭 caelundas-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Checks only what this workflow itself needs: the years, to count the
      # Job's completions and name the release, and the shape of each
      # environment line, so the JSON handed to Helm is safe. The CLI validates
      # every value itself, so a new option needs no change here. `jq` builds
      # the JSON; no input is ever spliced into a command.
      - name: ✅ Validate Inputs
        id: validate
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          EXTRA_ENVIRONMENT: ${{ inputs.environment }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          is_year() { [[ "$1" =~ ^[1-9][0-9]{0,3}$ ]]; }
          if ! is_year "$START_YEAR" || ! is_year "$END_YEAR" || (( START_YEAR > END_YEAR )); then
            echo "::error::start_year and end_year must be integers with start_year <= end_year"
            exit 1
          fi
          extra_env='[]'
          line_number=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line_number=$((line_number + 1))
            line="${line%$'\r'}"
            [[ -z "${line//[[:space:]]/}" ]] && continue
            if [[ ! "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::environment line $line_number must be NAME=value"
              exit 1
            fi
            extra_env="$(jq -c --arg name "${BASH_REMATCH[1]}" --arg value "${BASH_REMATCH[2]}" \
              '. + [{name: $name, value: $value}]' <<< "$extra_env")"
          done <<< "$EXTRA_ENVIRONMENT"
          # Last, so an environment line cannot override the start year.
          extra_env="$(jq -c --arg value "$START_YEAR" \
            '. + [{name: "START_YEAR", value: $value}]' <<< "$extra_env")"
          {
            echo "release=caelundas-ingestion-${START_YEAR}-${END_YEAR}-${RUN_ID}"
            echo "completions=$((END_YEAR - START_YEAR + 1))"
            echo "extra_env=$extra_env"
          } >> "$GITHUB_OUTPUT"

      # The GitHub-hosted runner ships kubectl and helm, and nothing here needs
      # a particular version of either, so neither is installed or pinned.
      - name: 🔑 Set Kubernetes Context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # `helm template` shows the image the release would run. The chart
      # renders `repository:tag`, so an empty tag ends in a colon.
      - name: 🚀 Install Ingestion Release
        env:
          RELEASE: ${{ steps.validate.outputs.release }}
          COMPLETIONS: ${{ steps.validate.outputs.completions }}
          EXTRA_ENV: ${{ steps.validate.outputs.extra_env }}
        run: |
          set -euo pipefail
          chart_arguments=(
            infrastructure/helm/kubernetes-job -n caelundas
            -f infrastructure/helm/kubernetes-job/values/base.yaml
            -f infrastructure/helm/kubernetes-job/values/caelundas-cli.yaml
            --set fullnameOverride="$RELEASE"
            --set job.completions="$COMPLETIONS"
            --set-json extraEnv="$EXTRA_ENV"
          )
          image="$(helm template "$RELEASE" "${chart_arguments[@]}" --show-only templates/job.yaml \
            | sed -n 's/^ *image: "\(.*\)"$/\1/p')"
          if [[ "$image" != *:?* ]]; then
            echo "::error::no caelundas-cli release yet"
            exit 1
          fi
          helm install "$RELEASE" "${chart_arguments[@]}"
          helm get notes "$RELEASE" -n caelundas >> "$GITHUB_STEP_SUMMARY"
