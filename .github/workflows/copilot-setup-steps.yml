name: 🤖 Setup Copilot

on:
  workflow_dispatch:
  push:
    # Branches only: a `paths` filter is not applied to a tag push, so without
    # this every release tag ran a job meant only for edits to this file.
    branches: ["**"]
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: 🤖 Setup Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      issues: write
      models: read
      packages: read
      pages: read
      pull-requests: write
      repository-projects: read
      security-events: read
      statuses: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-cache: "false"
          nx-graph-cache: "false"
          nx-shas: "false"
          python-dependencies: "false"
          uv: "true"

      # Restores the skills from `skills-lock.json`, so the Copilot agent reads every
      # skill the repository uses. Each skill is pulled at its current version rather
      # than the locked one, which is why this runs here and not in the shared setup action.
      - name: 🧩 Install Agent Skills
        run: pnpm exec skills experimental_install
        shell: bash

      - name: 🌿 Verify Branch Name
        run: |
          script="scripts/git/validate-session-branch-name.sh"
          validation_output="$(bash "${script}")"
          if [[ -n "${validation_output}" ]]; then
            echo "${validation_output}"
            exit 1
          fi
        shell: bash

      - name: 🔑 Authenticate GitHub CLI
        env:
          GH_TOKEN: >-
            ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: bash scripts/git/check-gh-authentication.sh
        shell: bash

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Verify Commit Signing Configuration
        run: |
          script="scripts/git/validate-session-commit-signing.sh"
          validation_output="$(bash "${script}")"
          if [[ -n "${validation_output}" ]]; then
            echo "${validation_output}"
            exit 1
          fi
        shell: bash
