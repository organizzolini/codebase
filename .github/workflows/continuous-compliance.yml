name: 🦹 Continuous Compliance

# Compliance checks, run by `compliance` directly through Node.js:
# 1. 🧑‍💼 Issue: issue metadata, types, hierarchy, and release significance.
# 2. 👮 Enforce: repository governance and workflow security.
# 3. 🧑‍⚖️ Comply: pull request metadata and commit message conventions.

on:
  push:
    branches:
      - main
  issues:
    types: [opened, reopened, unassigned, edited, labeled, unlabeled]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
  # The merge queue waits for every required check on the group's commit, and
  # 🧑‍⚖️ Comply is one of them. 👮 Enforce reports there too, so it can be made
  # required without stalling the queue.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: 18 12 * * 5 # Weekly Friday 8:18am NYC (EDT: 12:18 UTC / EST: 13:18 UTC)
  workflow_dispatch:

permissions:
  contents: read
  # Label creation and updates are issues-scoped and pull-requests-scoped
  # endpoints, which is what the compliance commands below write through.
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.head_ref || (github.ref == 'refs/heads/main' && github.sha || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue:
    name: 🧑‍💼 Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'issues' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The compliance CLI and the workspace packages it imports are all this
      # needs. Still no Nx cache, no uv, and no Homebrew: there is no project
      # graph to build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # One run per event: labels and assigns a new issue, audits the issue an
      # event names, or sweeps every open issue on scheduled and manual runs.
      - name: 🧑‍💼 Comply Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            compliance/src/compliance.main.ts issue

  enforce:
    name: 👮 Enforce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs before a change lands, so a governance break shows on its pull request.
    # Every non-draft pull request event runs it, since a run skipped on a later
    # event would replace an earlier failure on that commit.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # Audits repository governance (CODEOWNERS rules and workflow security).
      - name: 👮 Audit Repository Governance
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            compliance/src/compliance.main.ts audit-governance

  comply:
    name: 🧑‍⚖️ Comply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on Dependabot's pull requests too, so a label or release significance failure
    # shows before the merge queue. The title and body checks exempt them, since Dependabot writes both.
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # One run covers a pull request and a merge group. A merge group has no pull
      # request payload, so the command resolves the number and reads live metadata.
      - name: 🧑‍⚖️ Comply Pull Request
        id: pull-request
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            compliance/src/compliance.main.ts pull-request

      # Validates that the pull request branch name conforms to Conventional
      # Commits. A merge group's branch is the queue's own, so it is not checked.
      - name: 🌿 Validate Branch Name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          npx validate-branch-name -t "$BRANCH_NAME"

      # Validates that the latest commit on main follows Conventional Commits.
      # Skipped for a squash commit authored by Dependabot, whose subject is the
      # title the pull request check above exempts.
      - name: 🏷️ Validate Commit Message
        if: github.event_name == 'push' && github.event.head_commit.author.name != 'dependabot[bot]'
        run: |
          git log -1 --pretty=%s | \
            npx commitlint --config configuration/commitlint.config.ts

      # Validates the merge group's head commit, which is what lands on main.
      # GitHub does not document a queued squash commit's subject, so a generic
      # "Merge pull request #…" subject is passed; the live title check guards it.
      - name: 🏷️ Validate Merge Group Commit Message
        if: >-
          github.event_name == 'merge_group' &&
          steps.pull-request.outputs.pull-request-author != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s "$HEAD_SHA")"
          if [[ "$COMMIT_SUBJECT" == "Merge pull request #"* ]]; then
            echo "⏭️ Generic queue subject, not linted: ${COMMIT_SUBJECT}"
            exit 0
          fi
          echo "🏷️ Linting merge group commit subject: ${COMMIT_SUBJECT}"
          echo "$COMMIT_SUBJECT" | \
            npx commitlint --config configuration/commitlint.config.ts
