name: 🦹 Continuous Compliance

# External and repository compliance checks:
# 1. 🧑‍💼 Issue: Issue metadata, Issue Types (roots are Feature or Bug,
#    sub-issues are Task), hierarchy, and release significance.
# 2. 👮 Enforce: Repository governance and workflow security, on pull requests,
#    the merge queue, and main.
# 3. 🧑‍⚖️ Comply: Pull request metadata and commit message conventions, on
#    pull requests and again on the merge queue group that will land them.
#
# All external-resource checks run through `compliance`. Checks execute directly via
# Node.js without building an Nx project graph.

on:
  push:
    branches:
      - main
  issues:
    types: [opened, reopened, unassigned, edited, labeled, unlabeled]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
  # The merge queue waits for every required check on the group's commit, and
  # 🧑‍⚖️ Comply is one of them. 👮 Enforce reports there too, so it can be made
  # required without stalling the queue.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: 18 12 * * 5 # Weekly Friday 8:18am NYC (EDT: 12:18 UTC / EST: 13:18 UTC)
  workflow_dispatch:

permissions:
  contents: read
  # Label creation and updates are issues-scoped and pull-requests-scoped
  # endpoints, which is what the label reconciliation steps below write through.
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.head_ref || (github.ref == 'refs/heads/main' && github.sha || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue:
    name: 🧑‍💼 Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'issues' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The compliance CLI and the workspace packages it imports are all this
      # needs. Still no Nx cache, no uv, and no Homebrew: there is no project
      # graph to build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # Only on the event that creates an issue — an edit or a label change
      # never adds a field the body didn't already have, and re-adding labels
      # on every edit would fight a human who removed one on purpose.
      - name: 🏷️ Reconcile Issue Labels
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts issue-labels

      # Default unassigned issue events or sweep every open issue on scheduled
      # and manual runs. The command paginates and excludes pull requests.
      - name: 🧑‍💼 Ensure Issue Assignees
        if: >-
          (github.event_name == 'issues' &&
          github.event.issue != null &&
          github.event.issue.assignees[0] == null) ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts issue-assignees

      # Read live, by issue number, rather than out of this event's payload.
      - name: 🧾 Audit Single Issue Metadata
        if: github.event_name == 'issues' && github.event.issue != null
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts issue-metadata "$ISSUE_NUMBER"

      # Sweeps and audits all open issues and hierarchy relationships on
      # scheduled runs and manual dispatches.
      - name: 🧾 Audit All Open Issues Metadata
        if: github.event.issue == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts issue-metadata --all

  enforce:
    name: 👮 Enforce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs before a change lands, not only after, so a governance break shows
    # on its pull request instead of first on main. Dependabot's pull requests
    # are audited too, since the action bumps it opens are workflow edits, and
    # the audit reads only checked-out files, so it needs no secret. Every
    # non-draft pull request event runs it, edits and labels included: a run
    # skipped on a later event would replace an earlier failure on that commit.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # Audits repository governance (CODEOWNERS rules and workflow security).
      - name: 👮 Audit Repository Governance
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts audit-governance

  comply:
    name: 🧑‍⚖️ Comply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on Dependabot's pull requests too, so a label or release significance
    # failure shows on the pull request rather than first in the merge queue.
    # The title, body, and commit subject checks below exempt them: Dependabot
    # writes both, and appends a directory and group tail to the title that no
    # `dependabot.yml` field shortens past the 128-character header limit.
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter compliance... \
            --ignore-scripts

      # A merge group carries no pull request payload, only a synthetic ref.
      # Resolve live metadata here so the merge-queue checks use the same
      # number, author, title, and body as pull-request events.
      - name: 🚂 Resolve Pull Request Context
        id: pull-request-context
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE_FILE: pull_request_title.txt
          PULL_REQUEST_BODY_FILE: pull_request_body.md
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts pull-request-context

      # Adds non-closing references to every ancestor of a linked issue.
      # Editing the PR body triggers this check again, where it is a no-op.
      - name: 🔗 Add Parent Issue References
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_BODY_FILE: pull_request_body.md
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts pull-request-parent-links

      # Only on pull request events — syncs labels from PR title. A merge group
      # check must not write to the pull request it is judging.
      - name: 🏷️ Reconcile Pull Request Labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts pull-request-labels write

      # Validates that the pull request branch name conforms to Conventional
      # Commits. A merge group's branch is the queue's own, so it is not checked.
      - name: 🌿 Validate Branch Name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          npx validate-branch-name -t "$BRANCH_NAME"

      # Validates that the pull request title follows Conventional Commits
      # format. A merge group reads the title live, since the squash commit's
      # subject is that title and it may have been edited after queueing.
      # Skipped for a pull request Dependabot authored, whose title it writes
      # itself; keyed off the author, as the body check below is.
      - name: 🏷️ Validate Pull Request Title
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          (github.event.pull_request.user.login ||
          steps.pull-request-context.outputs.pull-request-author) != 'dependabot[bot]'
        env:
          PULL_REQUEST_TITLE_FILE: pull_request_title.txt
        run: |
          cat "$PULL_REQUEST_TITLE_FILE" | \
            npx commitlint --config configuration/commitlint.config.ts

      # Validates pull request body against required template sections. Skipped
      # for a pull request Dependabot authored, whose body it writes itself;
      # keyed off the author, not `github.actor`, which is whoever last labeled,
      # edited, or queued it.
      - name: 📝 Validate Pull Request Body
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          (github.event.pull_request.user.login ||
          steps.pull-request-context.outputs.pull-request-author) != 'dependabot[bot]'
        env:
          PULL_REQUEST_BODY_FILE: pull_request_body.md
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts pull-request-body \
            "$PULL_REQUEST_BODY_FILE"

      # Validates that PR title release significance matches or exceeds commits.
      - name: 🚦 Validate Release Significance
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.pull_request.number || steps.pull-request-context.outputs.pull-request-number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            projects/compliance/src/compliance.main.ts pull-request-release-significance \
            "$PULL_REQUEST_NUMBER"

      # Validates that the latest commit on main follows Conventional Commits.
      # Skipped for a squash commit authored by Dependabot, whose subject is the
      # title the pull request check above exempts.
      - name: 🏷️ Validate Commit Message
        if: github.event_name == 'push' && github.event.head_commit.author.name != 'dependabot[bot]'
        run: |
          git log -1 --pretty=%s | \
            npx commitlint --config configuration/commitlint.config.ts

      # Validates the merge group's head commit, which is exactly what lands on
      # main. GitHub does not document the subject a queued squash commit
      # carries, so a generic "Merge pull request #…" subject is logged and
      # passed; the live title check above is the guard in that case. Skipped
      # for a pull request Dependabot authored, like that title check.
      - name: 🏷️ Validate Merge Group Commit Message
        if: >-
          github.event_name == 'merge_group' &&
          steps.pull-request-context.outputs.pull-request-author != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s "$HEAD_SHA")"
          if [[ "$COMMIT_SUBJECT" == "Merge pull request #"* ]]; then
            echo "⏭️ Generic queue subject, not linted: ${COMMIT_SUBJECT}"
            exit 0
          fi
          echo "🏷️ Linting merge group commit subject: ${COMMIT_SUBJECT}"
          echo "$COMMIT_SUBJECT" | \
            npx commitlint --config configuration/commitlint.config.ts
