name: 📊 Report Integration
description: Process artifacts, baseline reports, and coverage after a CI run

inputs:
  github-token:
    description: GitHub Token for API calls
    required: true
  is-main-branch:
    description: Whether this is running on the main branch
    required: true
  is-pull-request:
    description: Whether this is running on a pull request
    required: true
  run-outcome:
    description: The outcome of the run-check step
    required: true
  pull-request-number:
    description: The pull request number
    required: false
  target:
    description: The matrix check target being run
    required: true
  shard:
    description: |
      The matrix leg's shard, when one target is split across legs. It
      suffixes the coverage artifact, whose name must be unique per run.
    default: ""

runs:
  using: composite
  steps:
    # A green `main` build is the baseline the next pull request is measured
    # against, so its reports are gathered here and uploaded below. See the
    # `collect-codometer-baseline` command of the `integration` project.
    - name: 🧺 Collect Codometer Baseline
      if: >-
        inputs.target == 'build-projects' &&
        inputs.is-main-branch == 'true' &&
        inputs.run-outcome == 'success'
      shell: bash
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          integration/src/integration.main.ts collect-codometer-baseline

    - name: 📤 Upload Codometer Baseline
      if: >-
        inputs.target == 'build-projects' &&
        inputs.is-main-branch == 'true' &&
        inputs.run-outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: codometer-reports-main
        path: codometer-baseline
        retention-days: 90
        if-no-files-found: ignore

    # Fetches that baseline, if there is one, and writes the changes against it
    # into the pull request body. See the `report-codometer-changes` command.
    - name: ⏲️ Report Codometer Changes
      if: inputs.target == 'build-projects' && inputs.is-pull-request == 'true'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PULL_REQUEST: ${{ inputs.pull-request-number }}
      shell: bash
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          integration/src/integration.main.ts report-codometer-changes

    - name: 📊 Upload Type Coverage
      if: inputs.run-outcome == 'failure' && inputs.target == 'typecheck-code'
      uses: actions/upload-artifact@v7
      with:
        name: type-coverage-reports
        path: |
          projects/*/type-coverage-report.txt
          projects/*/*/type-coverage-report.txt
          projects/ic-suite/*/*/type-coverage-report.txt
        retention-days: 30

    - name: 📊 Upload Test Coverage
      if: inputs.target == 'test-code'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports${{ inputs.shard && format('-{0}', inputs.shard) || '' }}
        path: |
          coverage/
          projects/**/coverage/
        retention-days: 30

    - name: 🚦 Enforce Limits
      if: inputs.target == 'build-projects' && inputs.run-outcome == 'failure'
      shell: bash
      run: |
        echo "::error::A project failed to build or breached its limit."
        exit 1
