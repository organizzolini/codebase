name: 🐳 Setup Docker
description: |
  Set up Docker Buildx and sign in to ghcr.io as the workflow's actor with its
  `GITHUB_TOKEN`, so the job needs `packages: read` to pull a cache and
  `packages: write` to push. The setup-codebase action's `deployment` input
  runs this; a job that needs only Docker calls it directly.

runs:
  using: composite
  steps:
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # The token is the workflow's own, read from the `github` context rather
    # than passed in, so a caller never handles it.
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
