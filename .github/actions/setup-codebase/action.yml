name: 🧑‍🍳 Setup Codebase
description: |
  Nx codebase setup with pnpm, node, and cache management
  (requires checkout first)

  Every optional step is gated by an input so a job pays only for what it
  uses. The tool installs exist for the security gate and the database
  tests, so only they should ask for them.

inputs:
  gitleaks:
    description: Install gitleaks (secret scanning)
    default: "false"
  install:
    description: Install node dependencies with pnpm
    default: "true"
  nx-cache:
    description: Restore and save the Nx task cache
    default: "true"
  nx-cache-scope:
    description: |
      What the Nx task cache key is partitioned by. Defaults to the job id,
      which is shared by every leg of a matrix job, so a matrix job must pass
      something unique to each leg, such as the target that leg runs.
    default: ${{ github.job }}
  nx-graph-cache:
    description: |
      Restore and save the Nx project graph (.nx/workspace-data, minus the
      task-result database, which travels with the task cache). Saves ~11s of
      cold graph construction on the first Nx invocation of a job.
    default: "true"
  nx-shas:
    description: Resolve NX_BASE and NX_HEAD, required by `nx affected`
    default: "true"
  nx-base:
    description: |
      Where a push's NX_BASE comes from. `last-successful`, the default, keeps
      `nx-set-shas`' answer: the last commit whose whole workflow succeeded,
      so a failed run is retried in full by the next one. `push-before` uses
      the push's own previous tip instead, falling back to `last-successful`
      when that is all zeros or not an ancestor of the head (a new branch, a
      force-push). Pull request and merge queue runs ignore this input.
    default: last-successful
  python-dependencies:
    description: |
      Sync the uv workspace into the shared root `.venv`. Defaults on because
      that venv is where `uv run yamllint` and `uv run sqlfluff` resolve from,
      and those run on every TypeScript project — not only the Python ones.
      Turn it off for a job that runs no Python-backed tool at all.
    default: "true"
  postgres-client:
    description: |
      Install the PostgreSQL 18 client tools (pg_dump, pg_restore) from the
      PGDG apt repository, which the database package's export and import
      integration tests run for real. The runner's own package is older than
      the server.
    default: "false"
  trivy:
    description: Install trivy (infrastructure scanning)
    default: "false"
  terraform:
    description: Install terraform (infrastructure lint, plan, and apply)
    default: "false"
  eslint-cache:
    description: Restore and save the ESLint cache
    default: "false"
  uv:
    description: |
      Install uv. Required by far more than the Python projects — yaml-lint
      and sqlfluff shell out to `uv run --project configuration` on every
      TypeScript project too.
    default: "true"

outputs:
  nx-cache-primary-key:
    description: |
      The exact-match key the Nx cache restore step computed for this job.
      Empty when `nx-cache` is "false". Pass it to `cleanup-codebase`'s own
      `nx-cache-primary-key` input so a save at the end of the job reuses the
      same key rather than recomputing it a second place.
    value: ${{ steps.nx-cache.outputs.cache-primary-key }}
  nx-cache-scope:
    description: |
      The `nx-cache-scope` this job used. Pass it to `cleanup-codebase`'s own
      `nx-cache-scope` input so the artifact it uploads is named the way a merge
      group looks for it.
    value: ${{ inputs.nx-cache-scope }}

runs:
  using: composite
  steps:
    - name: 📦 Setup pnpm
      uses: ./.github/actions/setup-pnpm

    - name: 🟢 Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: 🎯 Set Nx SHAs
      if: inputs.nx-shas == 'true'
      uses: nrwl/nx-set-shas@v5

    - name: 🗃️ Configure Nx Cache
      run: |
        echo "NX_DEFAULT_OUTPUT_STYLE=static" >> "$GITHUB_ENV"
        echo "NX_LEGACY_AFFECTED=false" >> "$GITHUB_ENV"
        echo "NX_PREFER_NODE_STRIP_TYPES=false" >> "$GITHUB_ENV"
      shell: bash

    # Exact match only, and no restore-keys: a partially stale project graph
    # is worse than rebuilding one. `nx reset` clears it if it ever misbehaves.
    #
    # The task-result database travels with `.nx/cache` below, never here: this
    # key is shared by every job. `path` lists the directory's entries because
    # an exclusion only drops files the inclusion enumerates; naming the
    # directory archived the database too, and each graph hit overwrote the
    # adopted one before any task ran. `v3` retires those tarballs, and running
    # before the task cache restore means the real database always lands last.
    - name: 🕸️ Sync Nx Graph
      if: inputs.nx-graph-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .nx/workspace-data/*
          !.nx/workspace-data/*.db*
        key: |
          nx-graph-v3-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml', 'nx.json', 'project.json',
          'projects/*/project.json', 'projects/*/*/project.json',
          'projects/ic-suite/*/*/project.json') }}

    # Keyed per check via `nx-cache-scope`, not `github.job`, which every
    # matrix leg shares: under one key the first leg saved it and the Test
    # leg restored a tarball holding no test results.
    #
    # The task-result database travels with these files, not the graph,
    # because it indexes them: both must come from one tarball. Nx keeps a
    # task's outputs in `.nx/cache/<hash>` and its log in
    # `.nx/cache/terminalOutputs/<hash>`, but decides a hit from the row in
    # `.nx/workspace-data/*.db` alone. A row without its files reports
    # `[local cache]`, restores nothing, and exits 0 — a build with no
    # `dist/`, hit at random, so a green re-run is luck. Files with no row
    # are an ordinary miss.

    # Restore only, saving is `cleanup-codebase`'s job. The combined
    # `actions/cache` action only saves on a clean exit, and its documented
    # `save-always` escape hatch is deprecated: its `post-if` cannot see that
    # input, so it never actually fires on a cancellation. The split
    # restore/save actions are the combination GitHub documents as saving
    # through a `timeout-minutes` kill, which is why a job that wants that
    # calls `cleanup-codebase` itself, last, with `if: always()`.
    - name: ♻️ Restore Nx Cache
      if: inputs.nx-cache == 'true'
      id: nx-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: |
          nx-cache-${{ inputs.nx-cache-scope }}-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-cache-${{ inputs.nx-cache-scope }}-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml') }}-
          nx-cache-${{ inputs.nx-cache-scope }}-${{ runner.os }}-

    - name: 🌌 Setup uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@v10.3.2
      with:
        # The version the devcontainers pin and the `software` command
        # installs, so a runner, a devcontainer, and a laptop run one uv. A
        # test holds the three equal.
        version: 0.12.3
        # The action's cache key does not name the uv version, so a cache an
        # older or newer uv filled would match and be useless: uv re-downloads
        # everything and, the key being taken, never saves its own. The same
        # version again, so a bump starts a fresh cache.
        cache-suffix: uv-0.12.3
        # Only a job that syncs may save the cache. The first job to finish
        # reserves the key and every later save is refused, so a job that
        # installs nothing, like `build-projects`, would keep a cache with no
        # packages in it for every sync after it.
        enable-cache: ${{ inputs.python-dependencies }}
        cache-dependency-glob: configuration/uv.lock
        add-problem-matchers: "false"

    # Pinned so a runner does not move to a new Terraform on its own: the state
    # file records the version that last wrote it. 1.14.5 is the version the
    # OpenRouter module was validated with. The wrapper is off so a step's
    # output is Terraform's own, which the plan comment reads.
    - name: 🏗️ Setup Terraform
      if: inputs.terraform == 'true'
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.14.5
        terraform_wrapper: false

    # Guarded on `uv` as well as its own input: `python-dependencies` defaults
    # on, so a job that opts out of installing uv would otherwise inherit a sync
    # it has no binary to run.
    - name: 🐍 Install Python Dependencies
      if: inputs.uv == 'true' && inputs.python-dependencies == 'true'
      # Syncs every uv workspace member into the shared root `.venv` via the
      # workspace definition in configuration/pyproject.toml.
      run: uv sync --frozen --quiet --project configuration
      shell: bash

    - name: ♻️ Sync ESLint Cache
      if: inputs.eslint-cache == 'true'
      uses: actions/cache@v6
      with:
        path: .eslintcache
        key: eslint-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          eslint-cache-${{ runner.os }}-

    # pnpm's bundled node-gyp lands `gyp/gyp_main.py` without an executable bit.
    # gyp runs it through `python3` itself, so generating a Makefile works — but
    # the Makefile gyp writes carries a self-regenerating rule that invokes the
    # same script as an executable, and that rule fires whenever `binding.gyp`
    # is not older than the Makefile. sweph writes `src/functions.cpp` from a
    # `preinstall` script, so both land in the same second and make's comparison
    # goes either way, which is why the install fails intermittently rather than
    # never or always. The failure reads as `gyp_main.py: Permission denied`
    # under a native build and looks like a code regression; it is not one.
    - name: 🔨 Repair node-gyp Permissions
      if: inputs.install == 'true'
      run: |
        pnpm_binary="$(readlink -f "$(command -v pnpm)")"
        pnpm_package_directory="$(dirname "${pnpm_binary}")/.."
        find "${pnpm_package_directory}" -name gyp_main.py -exec chmod +x {} + \
          || echo "No bundled gyp_main.py found; nothing to repair."
      shell: bash

    # The pnpm store, kept after the install that filled it. `setup-node`'s own
    # `cache: pnpm` saved whichever job finished first, and the jobs that skip
    # native builds finish first: the entry held a partial store with no
    # compiled `sweph` or `cpu-features`, so every job that needs them
    # downloaded the rest and compiled them again. The `v1` retires that entry.
    - name: 🗄️ Resolve pnpm Store
      if: inputs.install == 'true'
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      shell: bash

    - name: ♻️ Sync pnpm Store
      if: inputs.install == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-

    # The root `postinstall` script already runs `installed-skills write`
    # after this, which is idempotent and only boots its command, restoring
    # nothing, when every locked skill is already on disk (true here since
    # skills are committed).
    # A separate `skills experimental_install` step used to run redundantly
    # afterward, bypassing that guard and re-cloning every upstream skill
    # source on every job — that duplicate work is why this step is gone.
    - name: 📚 Install Node Dependencies
      if: inputs.install == 'true'
      # node-gyp builds with one make job unless told otherwise; `sweph` takes
      # half as long on all the runner's cores.
      env:
        JOBS: max
      run: CI=true pnpm install --frozen-lockfile --reporter=append-only
      shell: bash

    # gitleaks and Trivy are single binaries the `software` command downloads
    # into `~/.local/bin`, so that is all this keeps. Exact match only: the key
    # names the pinned versions through the file that holds them, so a version
    # bump is a miss and anything else is a hit. A hit makes the command find
    # both already installed and download nothing, which also takes the
    # release hosts out of the job. PostgreSQL comes from apt and is not kept.
    # The caches a pull request saves are readable only by itself, so `main`'s
    # is what a pull request and a merge group restore.
    - name: ♻️ Sync Release Archive Tools Cache
      if: inputs.gitleaks == 'true' || inputs.trivy == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/bin/gitleaks
          ~/.local/bin/trivy
        key: |
          release-archive-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
          'installation/src/modules/release-archives/release-archives.constants.ts')
          }}-gitleaks-${{ inputs.gitleaks }}-trivy-${{ inputs.trivy }}

    # The `software` command of the `installation` project, given names,
    # installs just the software the job asked for, from the same pinned
    # release archives and apt repository a developer's Linux machine uses, and
    # adds it to `PATH` for the steps after. It needs the installed
    # dependencies, so a job that skips the install skips it too.
    - name: 🧰 Software
      if: |
        (inputs.gitleaks == 'true' || inputs.trivy == 'true'
        || inputs.postgres-client == 'true')
        && hashFiles('node_modules/.modules.yaml') != ''
      shell: bash
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          installation/src/installation.main.ts software \
          ${{ inputs.gitleaks == 'true' && 'gitleaks' || '' }} \
          ${{ inputs.trivy == 'true' && 'trivy' || '' }} \
          ${{ inputs.postgres-client == 'true' && 'postgres-client' || '' }}

    # The `setup-codebase` command of the `integration` project runs these in
    # order: it bounds a push's base to the push's own previous tip (CI only,
    # `nx-base: push-before`), imports the pull request's Nx cache into a merge
    # group, discards a restored task database a cancelled save left damaged,
    # and renames the restored one to this runner's machine id so Nx reads it.
    # See the commands of those names for the reasoning of each.
    #
    # It needs the installed dependencies, so a job that skips the install skips
    # it too, rather than failing a second time. None of its steps feeds the
    # install, and the install opens no Nx task database, so nothing reaches
    # the restored one first.
    - name: 🩺 Setup Codebase
      if: hashFiles('node_modules/.modules.yaml') != ''
      env:
        BEFORE: ${{ github.event.before }}
        GH_TOKEN: ${{ github.token }}
        NX_BASE_SOURCE: ${{ inputs.nx-base }}
        NX_CACHE: ${{ inputs.nx-cache }}
        NX_CACHE_SCOPE: ${{ inputs.nx-cache-scope }}
        NX_SHAS: ${{ inputs.nx-shas }}
      shell: bash
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          integration/src/integration.main.ts setup-codebase
