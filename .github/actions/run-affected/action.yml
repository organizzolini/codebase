name: 🎯 Run Affected
description: |
  Run `nx affected` for one target between `NX_BASE` and `NX_HEAD` (requires
  `setup-codebase` with `nx-shas`).

  When `include-templates` is set (for `guard-code`), checks whether any
  conformetry templates were touched in git and passes `conformetry.config.ts`
  to ensure all instance projects run `conformetry-validate`.

inputs:
  target:
    description: The Nx target to run on every affected project
    required: true
  arguments:
    description: Extra `nx affected` flags, space separated
    default: ""
  include-spelling:
    description: Deprecated legacy flag; spelling inputs are now isolated natively
    default: "false"
  include-templates:
    description: |
      Select every conformetry instance project when a conformetry template
      changes. Set it only for the target whose `dependsOn` runs
      `conformetry-validate`.
    default: "false"

runs:
  using: composite
  steps:
    - name: 🎯 Run Affected
      shell: bash
      run: |
        EXTRA_ARGS=()
        if [ "${{ inputs.include-templates }}" = "true" ]; then
          MERGE_BASE=$(git merge-base "${NX_BASE}" "${NX_HEAD}" 2>/dev/null || echo "${NX_BASE}")
          if git diff --name-only --relative "${MERGE_BASE}" "${NX_HEAD}" | grep -q '^projects/configuration/conformetry-templates/'; then
            EXTRA_ARGS+=(--files=projects/configuration/conformetry.config.ts)
          fi
        fi

        pnpm exec nx affected \
          --base="${NX_BASE}" \
          --head="${NX_HEAD}" \
          --target="${{ inputs.target }}" \
          ${{ inputs.arguments }} \
          "${EXTRA_ARGS[@]}"

