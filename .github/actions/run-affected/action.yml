name: 🎯 Run Affected
description: |
  Run `nx affected` for one target between `NX_BASE` and `NX_HEAD` (requires
  `setup-codebase` with `nx-shas`), dropping spelling files from the change
  set unless `include-spelling` is set, and selecting every conformetry
  instance when a template changes if `include-templates` is set.

  The logic, and why `--stdin` is only its fallback, lives in the
  `run-affected` command of the `integration` project. It needs the installed
  dependencies, so this runs after `setup-codebase` has installed them.

inputs:
  target:
    description: The Nx target to run on every affected project
    required: true
  arguments:
    description: Extra `nx affected` flags, space separated
    default: ""
  include-spelling:
    description: |
      Keep spelling files in the changed file list. Set it only for the
      target whose `dependsOn` runs `spell-check`.
    default: "false"
  include-templates:
    description: |
      Select every conformetry instance project when a conformetry template
      changes. Set it only for the target whose `dependsOn` runs
      `conformetry-validate`.
    default: "false"

runs:
  using: composite
  steps:
    - name: 🎯 Run Affected
      env:
        TARGET: ${{ inputs.target }}
        ARGUMENTS: ${{ inputs.arguments }}
        INCLUDE_SPELLING: ${{ inputs.include-spelling }}
        INCLUDE_TEMPLATES: ${{ inputs.include-templates }}
        SPELLING_PATHS: ^configuration/\.cspell/|(^|/)cspell\.config\.yaml$
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          integration/src/integration.main.ts run-affected
      shell: bash
