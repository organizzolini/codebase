name: 🧑‍🌾 Cleanup Codebase
description: |
  Saves whatever progress a job made, even one a timeout or a cancellation
  cut short.

  Call this as a job's last step with `if: always()`, passing the
  `nx-cache-primary-key` `setup-codebase` output through. `setup-codebase`
  only restores the Nx task cache now, never saves it — a job that skips this
  action gets no save at all, clean exit or not, not only on a cancellation.

inputs:
  nx-cache:
    description: Save the Nx task cache `setup-codebase` restored
    default: "true"
  nx-cache-primary-key:
    description: |
      The exact-match key from `setup-codebase`'s own `nx-cache-primary-key`
      output. Required when `nx-cache` is "true"; saving is skipped, rather
      than failing the job, when it is empty — the same job asked
      `setup-codebase` to skip restoring, or restore itself never ran.
  nx-cache-scope:
    description: |
      The `nx-cache-scope` of `setup-codebase`, which names the artifact. Needed
      only when `nx-cache-artifact` is "true".
    default: ""
  nx-cache-artifact:
    description: |
      Upload the Nx task cache as a workflow artifact for the merge group to
      import. Set it only on a pull request from this repository, whose head
      commit names the artifact.
    default: "false"
  eslint-cache:
    description: Save the ESLint cache
    default: "false"

runs:
  using: composite
  steps:
    # A cancellation can corrupt the task-result database, and a corrupt copy saved here
    # is inherited by later jobs. The `cleanup-codebase` command of the `integration`
    # project discards damaged databases. It needs installed dependencies, so a job whose install never finished skips it.
    - name: 🩺 Cleanup Codebase
      if: |
        always() && inputs.nx-cache == 'true' &&
        hashFiles('node_modules/.modules.yaml') != ''
      env:
        NX_CACHE: ${{ inputs.nx-cache }}
      shell: bash
      run: |
        NODE_OPTIONS='' node --import @swc-node/register/esm-register \
          integration/src/integration.main.ts cleanup-codebase

    # `.nx/cache` and the task-result database hold every task that finished before a
    # cancellation. Saving that partial state lets a retry start from real progress.

    # `always()` is redundant with the calling step, but cheap insurance on cancellation.
    # The merge group cannot read the pull request's caches, so the `import-pr-task-cache`
    # command of the `deployment` project downloads this artifact instead. Three days cover the queue.
    - name: 📤 Share Nx Cache With The Merge Group
      if: |
        always() && inputs.nx-cache == 'true' && inputs.nx-cache-artifact ==
        'true' && inputs.nx-cache-scope != ''
      uses: actions/upload-artifact@v7
      with:
        name: nx-cache-${{ inputs.nx-cache-scope }}-${{ github.event.pull_request.head.sha }}
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        include-hidden-files: true
        if-no-files-found: ignore
        overwrite: true
        retention-days: 3

    - name: ♻️ Save Nx Cache
      if: |
        always() && inputs.nx-cache == 'true' && inputs.nx-cache-primary-key
        != ''
      uses: actions/cache/save@v6
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: ${{ inputs.nx-cache-primary-key }}

    - name: ♻️ Save ESLint Cache
      if: always() && inputs.eslint-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: .eslintcache
        key: eslint-cache-${{ runner.os }}-${{ github.sha }}
