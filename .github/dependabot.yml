# Dependabot bumps the npm and uv workspaces, GitHub Actions pins, Terraform providers,
# and devcontainer features. Each is its own entry below.
#
# One pull request per dependency, or per group, keeps one breaking major from blocking
# every other update, unlike a single `pnpm update` commit.

# continuous-compliance.yml checks Dependabot's labels and release significance
# but exempts its title and body: the generated title tail overflows commitlint's
# 128-character limit, and no field here shortens it. Entries set labels statically,
# and `chore` carries no release significance, so no version bump follows.

# The `commit-message.prefix` on every entry makes generated titles follow this
# repository's `<type>(<scope>): <gitmoji> <subject>` convention, so labels and
# release significance derive correctly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    # Matches pnpm-workspace.yaml's minimumReleaseAge: 1440 (1 day), so
    # Dependabot doesn't propose a version before pnpm itself would resolve
    # it.
    cooldown:
      default-days: 1
    commit-message:
      prefix: "chore(dependencies): 🔧 "
    labels:
      - type:chore
      - scope:dependencies
      - source:agent
    assignees:
      - JimmyPaolini
    groups:
      # Routine patch/minor churn across the ~200-entry catalog lands as one
      # pull request instead of dozens; a major always gets its own, so it
      # can fail its own checks without blocking anything grouped here.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # typescript 7 is native and exports only a version string, so the JavaScript
      # compiler API that nx, typescript-eslint, knip, and type-coverage use is gone.
      # Crossing that major is a deliberate migration, never an unattended bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-unicorn v68 renamed `prevent-abbreviations` to
      # `name-replacements`, and the majors since add or change dozens of
      # other rules. See configuration/eslint.config.ts and
      # .github/workflows/upgrade-dependencies.yml for the incident this
      # ignore rule replaces.
      - dependency-name: eslint-plugin-unicorn
        update-types: [version-update:semver-major]

  # One lockfile covers every uv workspace member.
  #
  # Dependabot's uv support is newer and has an open upstream bug
  # (dependabot-core#14004) matching this shape. Treat the first pull requests as
  # a trial. If it misbehaves, the weekly `uv lock --upgrade` in
  # upgrade-dependencies.yml is the fallback.
  - package-ecosystem: uv
    directory: /configuration
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(dependencies): 🔧 "
    labels:
      - type:chore
      - scope:dependencies
      - source:agent
    assignees:
      - JimmyPaolini
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # A single `directory: /` entry only scans workflow files in
  # .github/workflows — it does not reach action.yml files elsewhere, so
  # each composite action this repository ships needs its own path named
  # explicitly here or its pinned actions go stale silently.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-codebase
      - /.github/actions/setup-pnpm
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deployments): 🔧 "
    labels:
      - type:chore
      - scope:deployments
      - source:agent
    assignees:
      - JimmyPaolini
    groups:
      # Action version bumps are low-risk, small diffs — one pull request for
      # all of them keeps this from adding weekly PR noise on its own.
      actions:
        patterns:
          - "*"

  # Every Terraform root under infrastructure/terraform pins its providers: the
  # linode/linode cluster at the top, and one folder per module below it, such
  # as openrouter. One ecosystem covers them all, so a new module needs no entry.
  - package-ecosystem: terraform
    directories:
      - /infrastructure/terraform
      - /infrastructure/terraform/*
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: "chore(infrastructure): 🔧 "
    labels:
      - type:chore
      - scope:infrastructure
      - source:agent
    assignees:
      - JimmyPaolini

  # Both devcontainer.json files pin roughly a dozen versioned features
  # (ghcr.io/devcontainers/features/*), untouched by anything else here.
  - package-ecosystem: devcontainers
    directories:
      - /.devcontainer/local
      - /.devcontainer/cloud
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: "chore(configuration): 🔧 "
    labels:
      - type:chore
      - scope:configuration
      - source:agent
    assignees:
      - JimmyPaolini

  # Both directories also carry a docker-compose.yml pinning the same
  # mcr.microsoft.com/devcontainers/typescript-node base image, which the
  # devcontainers ecosystem above does not reach — a separate ecosystem
  # covers docker-compose's own image references.
  - package-ecosystem: docker-compose
    directories:
      - /.devcontainer/local
      - /.devcontainer/cloud
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: "chore(configuration): 🔧 "
    labels:
      - type:chore
      - scope:configuration
      - source:agent
    assignees:
      - JimmyPaolini
