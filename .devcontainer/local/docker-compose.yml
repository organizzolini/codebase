services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    container_name: codebase-devcontainer
    volumes:
      # Relative paths resolve against the first dockerComposeFile entry
      # (infrastructure/docker/), not this file's directory.
      - ../..:/workspaces/codebase:cached
      - codebase-node-modules:/workspaces/codebase/node_modules
      - codebase-pnpm:/root/.local/share/pnpm
    env_file:
      # The codebase root level .env file, relative to
      # infrastructure/docker/
      - ../../.env
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 6g
    command: sleep infinity

volumes:
  codebase-node-modules:
    name: codebase-node-modules
  codebase-pnpm:
    name: codebase-pnpm
